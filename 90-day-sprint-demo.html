<!DOCTYPE html>
<html lang="en" data-theme="sprintcream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90-Day Sprint Planner — DEMO</title>
<style>
:root{
  --bg:#FBF6EC; --card:#FFFFFF; --ink:#2A2140; --muted:#7A7194; --line:#E9DFC9;
  --accent:#6C2BD9; --accent2:#F5A301; --accent-soft:#EFE7FB; --good:#1E9E6A; --bad:#D64545; --warn:#E8871E;
  --grad:linear-gradient(120deg,#6C2BD9,#9D5CFF); --shadow:0 8px 24px rgba(60,30,110,.10); --radius:16px;
}
html[data-theme="victoryviolet"]{--bg:#1D1233;--card:#2A1B4A;--ink:#F3EDFF;--muted:#B7A8DC;--line:#3D2A66;--accent:#B78CFF;--accent2:#FFB92E;--accent-soft:#33235C;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="midnightamber"]{--bg:#17130B;--card:#261D0E;--ink:#FBF1DC;--muted:#C4AC7E;--line:#3A2C15;--accent:#FFB92E;--accent2:#FF8A3D;--accent-soft:#33270F;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="plumroyale"]{--bg:#2B1030;--card:#3D1745;--ink:#FBEFFD;--muted:#D3A6DC;--line:#52255E;--accent:#E58BE8;--accent2:#FFB92E;--accent-soft:#481E52;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="indigonight"]{--bg:#101736;--card:#1A2450;--ink:#EBEFFF;--muted:#A3B0E0;--line:#2A376E;--accent:#7C9CFF;--accent2:#F5A301;--accent-soft:#232F63;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="charcoalgold"]{--bg:#1B1B1F;--card:#28282E;--ink:#F5F2EA;--muted:#B9B4A6;--line:#3B3B42;--accent:#E9C46A;--accent2:#B78CFF;--accent-soft:#33331F;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="lavendermist"]{--bg:#F4F0FD;--card:#FFFFFF;--ink:#33255C;--muted:#8B7BB8;--line:#E0D6F5;--accent:#7C4DFF;--accent2:#FF9F1C;--accent-soft:#EAE2FD}
html[data-theme="peachsprint"]{--bg:#FFF4EA;--card:#FFFFFF;--ink:#4A2C14;--muted:#A97E56;--line:#F5DEC4;--accent:#E85D04;--accent2:#7C4DFF;--accent-soft:#FFE8D1}
html[data-theme="minttrack"]{--bg:#EDFBF4;--card:#FFFFFF;--ink:#123B2A;--muted:#5E8A74;--line:#CDEEDB;--accent:#0E9F6E;--accent2:#F5A301;--accent-soft:#D8F5E5}
html[data-theme="skylap"]{--bg:#EDF5FF;--card:#FFFFFF;--ink:#173A5E;--muted:#64819F;--line:#D2E4F7;--accent:#2272C9;--accent2:#F5A301;--accent-soft:#DCEBFC}
html[data-colourful="off"]{--accent2:var(--accent)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{resize:vertical;min-height:56px}
label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin:12px 0 5px}
#bgphoto{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.16;pointer-events:none;z-index:0}
#appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:2px solid var(--line)}
#appbar .logo{font-size:21px}
#appbar .ttl{font-weight:800;font-size:16.5px;line-height:1.1}
#appbar .ttl small{display:block;font-size:11px;color:var(--muted);font-weight:600}
#appbar .sp{flex:1}
.ava{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden;cursor:pointer;border:2.5px solid var(--accent2);flex:none;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.ava:hover::after{content:'📷';position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:15px}
.iconbtn{background:var(--accent-soft);border:none;border-radius:11px;padding:9px 12px;font-size:16px;color:var(--ink)}
.iconbtn:hover{background:var(--accent);color:#fff}
#shell{display:flex;max-width:1280px;margin:0 auto;position:relative;z-index:1}
#sidebar{width:238px;flex:none;padding:16px 10px;display:none}
#sidebar.open{display:block}
@media(min-width:900px){#sidebar{display:block;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}}
@media(max-width:899px){#sidebar{position:fixed;left:0;top:62px;bottom:0;background:var(--card);z-index:35;box-shadow:var(--shadow)}}
#sidebar a{display:flex;gap:9px;align-items:center;padding:8.5px 11px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px}
#sidebar a:hover{background:var(--accent-soft)}
#sidebar a.on{background:var(--grad);color:#fff}
#sidebar .grp{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:13px 11px 5px;text-transform:uppercase}
main{flex:1;padding:18px 16px 70px;min-width:0}
.hero{background:var(--grad);border-radius:20px;color:#fff;padding:24px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'🏁';position:absolute;right:14px;top:8px;font-size:64px;opacity:.22}
.hero h1{font-size:27px;line-height:1.15}
.hero .sub{opacity:.92;margin-top:5px;font-size:14.5px}
.daycount{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:rgba(255,255,255,.3)}
.ring .pr{stroke:#FFD166;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{fill:#fff;font-weight:800;font-size:19px}
.pacebadge{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);padding:9px 14px;border-radius:12px;font-weight:800;font-size:15px}
.quickrow{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.qbtn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 15px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:var(--shadow)}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px;margin-top:8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .ic{font-size:27px}
.card h3{font-size:16px;margin:8px 0 4px}
.card p{font-size:13px;color:var(--muted);line-height:1.45}
.card .bar{height:7px;background:var(--accent-soft);border-radius:5px;margin-top:11px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.card .pct{font-size:11.5px;font-weight:800;color:var(--accent);margin-top:5px}
.secttl{display:flex;align-items:center;gap:11px;margin-bottom:6px;flex-wrap:wrap}
.secttl h2{font-size:23px}
.secttl .sp{flex:1}
.infobtn{margin-left:auto;background:var(--accent2);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;box-shadow:var(--shadow)}
.backbtn{background:none;border:none;font-size:15px;font-weight:700;color:var(--accent);padding:6px 0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.panel h3{font-size:16.5px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.btn{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-weight:800;font-size:14.5px}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:#D64545}
.btn:disabled{opacity:.5}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3.5px 11px;font-size:12px;font-weight:800;margin:2px 3px 2px 0}
.chip.amber{background:#FDEBC8;color:#8A5A00}
html[data-theme$="violet"] .chip.amber,html[data-theme="midnightamber"] .chip.amber,html[data-theme="plumroyale"] .chip.amber,html[data-theme="indigonight"] .chip.amber,html[data-theme="charcoalgold"] .chip.amber{background:#4A3603;color:#FFD166}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:9px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15px}
.item .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.mini{background:none;border:none;font-size:16px;padding:4px}
.tick{width:27px;height:27px;flex:none;border-radius:9px;border:2px solid var(--accent);background:var(--card);font-size:15px;color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tick.on{background:var(--accent);color:#fff}
.done-t{text-decoration:line-through;opacity:.55}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);margin-top:14px;font-size:14.5px;line-height:1.55}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal h3{font-size:19px;margin-bottom:8px}
.modal .x{float:right;background:none;border:none;font-size:20px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:99;transition:transform .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.paceline{height:16px;background:var(--accent-soft);border-radius:9px;position:relative;margin:10px 0 4px}
.paceline .ideal{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted);border-radius:2px}
.paceline .actual{height:100%;background:var(--grad);border-radius:9px}
table.cal{width:100%;border-collapse:collapse;margin-top:8px}
table.cal th{font-size:11.5px;color:var(--muted);padding:5px 2px;text-transform:uppercase}
table.cal td{border:1px solid var(--line);height:52px;vertical-align:top;padding:4px;font-size:12px;width:14.28%}
table.cal td .dn{font-weight:800;font-size:13px}
table.cal td.sprint{background:var(--accent-soft)}
table.cal td.today{outline:2.5px solid var(--accent2);outline-offset:-2px}
table.cal td{cursor:pointer}
.hgrid{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.hgrid .cell{width:19px;height:19px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--line);cursor:pointer;font-size:0}
.hgrid .cell.on{background:var(--accent)}
.hgrid .cell.today{outline:2px solid var(--accent2)}
.hgrid .cell.future{opacity:.35;cursor:default}
.scorebig{font-size:44px;font-weight:900;line-height:1}
.cert{background:linear-gradient(135deg,#FFFDF5,#FBF3DC);color:#2A2140;border:3px solid #C9A227;border-radius:14px;padding:34px 26px;text-align:center;position:relative}
.cert::before{content:'';position:absolute;inset:9px;border:1.5px solid #C9A227;border-radius:9px;pointer-events:none}
.cert h2{font-family:Georgia,serif;font-size:31px;color:#6C2BD9}
.cert .nm{font-family:Georgia,serif;font-size:27px;font-weight:700;margin:10px 0}
.paper{background:var(--card);border:1.5px solid var(--line);border-radius:12px;min-height:300px;padding:14px;margin-top:10px}
.paper.lined{background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 28px)}
.paper.dotted{background-image:radial-gradient(var(--line) 1.3px,transparent 1.4px);background-size:22px 22px}
.paper.gridp{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.paper textarea{background:transparent;border:none;width:100%;min-height:280px;line-height:28px;font-size:15px}
.paper textarea:focus{outline:none}
.honest{text-align:center;color:var(--muted);font-size:12.5px;margin-top:34px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-top:14px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.kpi b{font-size:23px;display:block}
.kpi span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
svg text{font-family:inherit}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:3px;width:104px;padding:13px 6px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-size:12px;font-weight:700}
.badge .bi{font-size:29px}
.badge.off{opacity:.38;filter:grayscale(1)}
#timerov{position:fixed;inset:0;background:#1D1233;color:#fff;display:none;z-index:90;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#timerov.open{display:flex}
#timerov .clock{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums}
@media print{ #appbar,#sidebar,.quickrow,.infobtn,.backbtn,#toast,.noprint{display:none!important} body{background:#fff} main{padding:0} .panel,.card{box-shadow:none} }
</style>
</head>
<body>
<div id="bgphoto"></div>
<header id="appbar">
  <button class="iconbtn" id="menubtn" title="Menu">☰</button>
  <div class="logo">🏁</div>
  <div class="ttl">90-Day Sprint<small>THE DIGITAL PLANNER ERA</small></div>
  <div class="sp"></div>
  <button class="iconbtn" id="themebtn" title="Themes & colours">🎨</button>
  <button class="iconbtn" id="printbtn" title="Print this section">🖨️</button>
  <div class="ava" id="avatar" title="Your profile photo — tap to change">S</div>
  <input type="file" id="avatarFile" accept="image/*" style="display:none">
</header>
<div id="shell">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="modal" id="infomodal"><div class="box" id="infobox"></div></div>
<div id="timerov">
  <div style="font-size:19px;font-weight:700" id="ovlabel">Focus Sprint</div>
  <div class="clock" id="ovclock">25:00</div>
  <div style="opacity:.85" id="ovgoal"></div>
  <div class="row" style="max-width:340px;width:90%">
    <button class="btn" id="ovpause" style="flex:1">⏸ Pause</button>
    <button class="btn ghost" id="ovend" style="flex:1;background:transparent;color:#fff;border-color:#fff">⏹ End & log</button>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="onboard"><div class="box" id="onboardbox"></div></div>
<script>
/* ============ 90-DAY SPRINT — CORE ============ */
const LS_KEY='sprint90_v1';
const DEMO = document.title.includes('DEMO');
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=> 'id'+Math.random().toString(36).slice(2,9);
const esc=s=> String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{ if(!iso) return '—'; const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const addDays=(iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const THEMES=[
 ['sprintcream','🏁 Sprint Cream','light'],['victoryviolet','🏆 Victory Violet','dark'],
 ['lavendermist','💜 Lavender Mist','light'],['midnightamber','🌙 Midnight Amber','dark'],
 ['peachsprint','🍑 Peach Sprint','light'],['plumroyale','👑 Plum Royale','dark'],
 ['minttrack','🌿 Mint Track','light'],['indigonight','🌌 Indigo Night','dark'],
 ['skylap','☁️ Sky Lap','light'],['charcoalgold','🖤 Charcoal Gold','dark']];
function blankState(){ return {
 profile:{name:'',goal:'',startDate:'',currency:'$',theme:'sprintcream',accent:'',colourful:true,photo:'',onboarded:false},
 bridgeIn:{where:'',why:'',tried:'',lesson:''},
 goals:[], milestones:[], monthlyFocus:{1:{focus:'',plan:''},2:{focus:'',plan:''},3:{focus:'',plan:''}},
 monthlyReview:{1:{win:'',lesson:'',adjust:''},2:{win:'',lesson:'',adjust:''},3:{win:'',lesson:'',adjust:''}},
 premortem:[], habits:[], habitLog:{}, daily:{},
 weeklyPlan:{}, weeklyReview:{}, midpoint:{state:'',working:'',notworking:'',change:'',promise:''},
 rescue:{}, wellnessMenu:['10-minute walk','Stretch & breathe','No-phone hour','Early night','Music break','Sunlight & fresh air'], wellnessLog:{},
 rewardsWish:'', focusLog:[], finalReview:{proud:'',learned:'',missed:'',carry:''},
 next90:{goal:'',keep:'',change:'',start:''}, notes:{paper:'lined',text:''},
 lastBackup:'', lastSection:'home', createdAt:Date.now() }; }
let S;
function save(){ if(DEMO) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=Object.assign(blankState(), JSON.parse(raw)); return; } }catch(e){} S=blankState(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function openModal(html){ $('#modalbox').innerHTML='<button class="x" onclick="closeModal()">✕</button>'+html; $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }
function confirmBox(msg, fn){ openModal('<h3>Are you sure?</h3><p style="line-height:1.55">'+esc(msg)+'</p><div class="row" style="margin-top:16px"><button class="btn danger" id="cfYes">Yes, do it</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>'); $('#cfYes').onclick=()=>{ closeModal(); fn(); }; }
/* ---- sprint maths ---- */
function startISO(){ return S.profile.startDate || todayISO(); }
function dayOf(iso){ const a=new Date(startISO()+'T12:00:00'), b=new Date((iso||todayISO())+'T12:00:00'); return Math.floor((b-a)/86400000)+1; }
function curDay(){ return Math.min(90, Math.max(0, dayOf(todayISO()))); }
function weekOfDay(d){ return Math.min(13, Math.max(1, Math.ceil(d/7))); }
function curWeek(){ return weekOfDay(Math.max(1,curDay())); }
function dayISO(d){ return addDays(startISO(), d-1); }
function stepsTotal(){ let t=0,d=0; S.milestones.forEach(m=>{ t+= 1 + (m.steps||[]).length; d+= (m.done?1:0) + (m.steps||[]).filter(s=>s.done).length; }); return {t,d}; }
function progressPct(){ const {t,d}=stepsTotal(); if(t===0) return S.milestones.length? Math.round(S.milestones.filter(m=>m.done).length/S.milestones.length*100):0; return Math.round(d/t*100); }
function pace(){ const day=Math.max(1,curDay()); const ideal=Math.round(day/90*100); const actual=progressPct(); const diff=actual-ideal; const daysOff=Math.round(Math.abs(diff)/100*90);
 let verdict, cls; if(curDay()===0){ verdict='NOT STARTED'; cls='amber'; } else if(diff>=3){ verdict='AHEAD by ~'+daysOff+' day'+(daysOff===1?'':'s'); cls=''; } else if(diff<=-3){ verdict='BEHIND by ~'+daysOff+' day'+(daysOff===1?'':'s'); cls='amber'; } else { verdict='ON PACE'; cls=''; }
 return {ideal, actual, diff, verdict, daysOff}; }
function habitStreak(hid){ let best=0,run=0; for(let d=1; d<=90; d++){ if(S.habitLog[hid] && S.habitLog[hid][d]){ run++; best=Math.max(best,run); } else run=0; }
 let cur=0; for(let d=Math.max(1,curDay()); d>=1; d--){ if(S.habitLog[hid] && S.habitLog[hid][d]) cur++; else if(d<curDay()) break; else continue; } return {cur, best}; }
function weekScore(w){ const rev=S.weeklyReview[w]; if(rev && typeof rev.score==='number') return rev.score;
 if(w>curWeek()) return null; const lastDay=Math.min(90, w*7, Math.max(1,curDay()));
 let pts=0, tot=0; for(let d=(w-1)*7+1; d<=lastDay; d++){ const dy=S.daily[d]; if(dy && dy.top3){ dy.top3.forEach(t=>{ if(t.t){ tot++; if(t.done) pts++; } }); } }
 S.habits.forEach(h=>{ for(let d=(w-1)*7+1; d<=lastDay; d++){ tot++; if(S.habitLog[h.id] && S.habitLog[h.id][d]) pts++; } });
 if(tot===0) return null; return Math.round(pts/tot*100); }
function sprintScore(){ const done=[]; for(let w=1; w<=13; w++){ const sc=weekScore(w); if(sc!==null) done.push(sc); } if(!done.length) return null; return Math.round(done.reduce((a,b)=>a+b,0)/done.length); }
function deepMinutes(dayNum){ let m=0; S.focusLog.forEach(f=>{ if(f.day===dayNum) m+=f.min; }); const dy=S.daily[dayNum]; if(dy && dy.deep) m+= (+dy.deep||0); return m; }

function sectionProgress(id){ const d=S.daily; switch(id){
 case 'bridge': { const b=S.bridgeIn; return [b.where,b.why,b.tried,b.lesson].filter(x=>x&&x.trim()).length/4; }
 case 'goal': return Math.min(1, S.goals.length/1);
 case 'milestones': { const {t,dd}=(()=>{const x=stepsTotal(); return {t:x.t, dd:x.d};})(); return t? dd/t:0; }
 case 'monthly': return [1,2,3].filter(m=>S.monthlyFocus[m].focus.trim()).length/3;
 case 'premortem': return Math.min(1, S.premortem.length/3);
 case 'board': case 'forecast': return progressPct()/100;
 case 'score': { const sc=sprintScore(); return sc===null?0:sc/100; }
 case 'habits': { if(!S.habits.length) return 0; let t=0,dn=0; S.habits.forEach(h=>{ for(let d=1; d<=Math.max(1,curDay()); d++){ t++; if(S.habitLog[h.id]&&S.habitLog[h.id][d]) dn++; } }); return t? dn/t:0; }
 case 'daily': { let n=0; for(let d=1; d<=Math.max(1,curDay()); d++){ const dy=S.daily[d]; if(dy&&(dy.top3||[]).some(t=>t.t)) n++; } return Math.max(1,curDay())? n/Math.max(1,curDay()):0; }
 case 'weeklyplan': return Object.keys(S.weeklyPlan).filter(k=>S.weeklyPlan[k].focus).length/13;
 case 'weeklyreview': return Object.keys(S.weeklyReview).filter(k=>S.weeklyReview[k].went!==undefined).length/13;
 case 'midpoint': return [S.midpoint.working,S.midpoint.notworking,S.midpoint.change].filter(x=>x&&x.trim()).length/3;
 case 'final': return [S.finalReview.proud,S.finalReview.learned,S.finalReview.carry].filter(x=>x&&x.trim()).length/3;
 case 'next90': return S.next90.goal.trim()?1:0;
 case 'wellness': return Math.min(1, Object.keys(S.wellnessLog).length/10);
 default: return 0; } }

 +'<div><div class="pacebadge">🏎️ PACE LINE: '+p.verdict+'</div><div style="margin-top:8px;font-size:13.5px;opacity:.92">Ideal by today: '+p.ideal+'% · You: '+p.actual+'% · Sprint Score: '+(sprintScore()===null?'—':sprintScore()+'/100')+'</div></div></div></div>';

function renderTimer(){ let h=secHead('timer','⏱️','Focus Timer — Pomodoro');

function fmtClock(){ const m=Math.floor(timer.left/60), s=timer.left%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function setTimer(min,mode){ stopTimer(); timer.total=timer.left=min*60; timer.mode=mode; render(); }
function resetTimer(){ stopTimer(); timer.left=timer.total; render(); }
function stopTimer(){ if(timer.iv) clearInterval(timer.iv); timer.iv=null; timer.run=false; }
function toggleTimer(){ if(timer.run){ stopTimer(); render(); return; } timer.run=true; timer.iv=setInterval(()=>{ timer.left--; const c=$('#clock'); if(c) c.textContent=fmtClock(); const oc=$('#ovclock'); if(oc) oc.textContent=fmtClock(); if(timer.left<=0){ finishTimer(); } },1000); render(); }
function finishTimer(){ stopTimer(); const mins=Math.round(timer.total/60); if(timer.mode==='Focus' && curDay()>=1){ S.focusLog.push({day:curDay(), min:mins, at:Date.now()}); save(); } $('#timerov').classList.remove('open'); timer.left=timer.total; toast('⏱️ '+timer.mode+' done'+(timer.mode==='Focus'? ' — '+mins+' deep minutes logged to Day '+curDay():'')); render(); }
function openFocus(){ $('#ovlabel').textContent=timer.mode+' Sprint'; $('#ovclock').textContent=fmtClock(); $('#ovgoal').textContent=S.profile.goal||''; $('#timerov').classList.add('open'); if(!timer.run) toggleTimer(); }
function bindTimerOverlay(){ $('#ovpause').onclick=()=>{ toggleTimer(); $('#ovpause').textContent=timer.run?'⏸ Pause':'▶ Resume'; }; $('#ovend').onclick=()=>{ $('#timerov').classList.remove('open'); if(timer.mode==='Focus' && timer.left<timer.total){ const done=Math.round((timer.total-timer.left)/60); if(done>0 && curDay()>=1){ S.focusLog.push({day:curDay(), min:done, at:Date.now()}); save(); toast('🧠 '+done+' deep minutes logged'); } } stopTimer(); timer.left=timer.total; render(); }; }

 else { const rate=progressPct()/day; const projPct=Math.min(100, Math.round(rate*90)); const finishDay= rate>0? Math.ceil(100/rate): 999; proj=projPct+'%'; note= finishDay<=90? 'At today\'s rate you finish 100% around Day '+finishDay+' — about '+(90-finishDay)+' days EARLY. 🏁' : 'At today\'s rate Day 90 finds you at ~'+projPct+'%. To finish fully you need about '+Math.ceil((100-progressPct())/Math.max(1,90-day)*10)/10+'% per day from now — that is roughly one milestone step a day.'; }

function setTheme(id){ S.profile.theme=id; save(); applyTheme(); render(); }
function setPhoto(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ S.profile.photo=r.result; save(); applyTheme(); toast('🖼️ Photo set'); render(); }; r.readAsDataURL(f); }
function exportBackup(){ S.lastBackup=Date.now(); save(); download('90day-sprint-backup.json', JSON.stringify(S,null,2)); toast('⬇ Backup downloaded'); }
function importBackup(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.profile) throw 0; S=Object.assign(blankState(), j); save(); applyTheme(); toast('⬆ Backup restored'); go('home'); }catch(e){ toast('That file is not a sprint backup'); } }; r.readAsText(f); }
function resetAll(){ confirmBox('Archive & reset? Everything in this sprint will be cleared. Export a backup first if you want to keep it.', ()=>{ const keepTheme=S.profile.theme; localStorage.removeItem(LS_KEY); S=blankState(); S.profile.theme=keepTheme; S.profile.onboarded=true; save(); applyTheme(); toast('🗑️ Fresh sprint — blank and ready'); go('home'); }); }
function restoreSample(){ localStorage.removeItem(LS_KEY); S=sampleState(); save(); applyTheme(); toast('↺ Sample sprint restored'); go('home'); }
/* ============ SAMPLE (worked example sprint) ============ */
function sampleState(){ const s=blankState(); const start=addDays(todayISO(),-20); // Day 21 of the sprint
 s.profile={name:'Alex', goal:'Launch my Etsy sticker shop', startDate:start, currency:'$', theme:'sprintcream', accent:'', colourful:true, photo:'', onboarded:true};
 s.bridgeIn={where:'I have designs saved on my laptop but no shop, no listings, no sales yet.', why:'I want a second income I control — and proof I can finish something I start.', tried:'I opened a shop in 2025 with 2 listings, got busy at work and quietly stopped in week 3.', lesson:'Small daily sessions beat weekend marathons. Never-zero is the rule this time.'};
 s.goals=[{id:'g1', title:'Launch my Etsy sticker shop', measure:'Listings live + sales', target:'12 listings, first 10 sales', why:'Second income + proof I finish things'}];
 s.milestones=[
  {id:'m1', goalId:'g1', title:'Shop set up & branded', dueDay:7, done:true, steps:[{id:'s1',t:'Choose shop name',done:true},{id:'s2',t:'Banner + logo in brand colours',done:true},{id:'s3',t:'Shop policies written',done:true}]},
  {id:'m2', goalId:'g1', title:'First 4 listings live', dueDay:21, done:false, steps:[{id:'s4',t:'Photograph sticker sheets',done:true},{id:'s5',t:'Write titles with keywords',done:true},{id:'s6',t:'Publish listings 1–4',done:false}]},
  {id:'m3', goalId:'g1', title:'Listings 5–8 + first sale', dueDay:40, done:false, steps:[{id:'s7',t:'Design 4 new sheets',done:false},{id:'s8',t:'Share one product video',done:false}]},
  {id:'m4', goalId:'g1', title:'Listings 9–12 + bundle offer', dueDay:65, done:false, steps:[{id:'s9',t:'Create bundle listing',done:false}]},
  {id:'m5', goalId:'g1', title:'10 sales & review the sprint', dueDay:90, done:false, steps:[]}];
 s.monthlyFocus={1:{focus:'FOUNDATIONS — shop live with 4 listings', plan:'Branding week 1, listings weeks 2–3, first shares week 4.'},2:{focus:'GROW — 8 listings + first sales push', plan:''},3:{focus:'FINISH — 12 listings, bundle, 10 sales', plan:''}};
 s.premortem=[{id:'r1', risk:'Day job gets busy in weeks 5–7', plan:'drop to 20-minute sessions, never zero'}, {id:'r2', risk:'No sales by Day 40 and motivation dips', plan:'ask 3 friends for honest listing feedback and fix the top issue'}, {id:'r3', risk:'Perfectionism on photos delays publishing', plan:'publish at 80% good — improve photos later with real data'}];
 s.habits=[{id:'h1', name:'25-min shop session'}, {id:'h2', name:'Post 1 update / pin'}];
 [1,2,3,4,5,6,8,9,10,11,12,13,15,16,17,18,19,20].forEach(d=>{ s.habitLog['h1']=s.habitLog['h1']||{}; s.habitLog['h1'][d]=true; });
 [2,5,9,12,16,19].forEach(d=>{ s.habitLog['h2']=s.habitLog['h2']||{}; s.habitLog['h2'][d]=true; });
 for(let d=1; d<=20; d++){ const tasks=[['Set up shop basics','Photograph products','Write one listing'],['Design a new sheet','Share a pin','Check stats'],['Fix listing photos','Write titles','Plan week']]; s.daily[d]={top3: tasks[d%3].map((t,i)=>({t, done: !(d>17&&i===2)})), gratitude: d%2? 'My future self, for starting':'A quiet morning', deep: d%3===0? '50':'', mood:'🙂 Okay', note:''}; }
 s.daily[21]={top3:[{t:'Publish listings 1–4',done:false},{t:'Share launch pin',done:false},{t:'Tell 3 friends',done:false}], gratitude:'', deep:'', mood:'', note:''};
 s.weeklyPlan={1:{focus:'Set up & brand', plan:'Name, banner, policies by Sunday.'},2:{focus:'Listings 1–4', plan:'Photos Monday, titles Wednesday, publish Friday.'},3:{focus:'Publish + share', plan:'Go live, first pins, tell friends.'}};
 s.weeklyReview={1:{went:'Shop is live and branded', didnt:'Banner took 2 evenings', lesson:'Good enough ships; perfect delays', score:80},2:{went:'Photos done for all 4', didnt:'Titles took longer than planned', lesson:'Draft titles while photographing', score:75}};
 s.focusLog=[{day:19,min:25,at:Date.now()},{day:20,min:25,at:Date.now()},{day:20,min:25,at:Date.now()}];
 s.wellnessLog={18:['10-minute walk'],20:['Early night']};
 return s; }
/* ============ ONBOARDING ============ */
function showOnboard(){ const p=S.profile; $('#onboardbox').innerHTML='<h3 style="font-size:22px">🏁 Start your 90-Day Sprint</h3><p style="color:var(--muted);line-height:1.55;margin-top:4px">Ninety days. One to three goals. A Pace Line that tells you the truth every day. Set up in under a minute:</p>'
 +'<label>Your name (optional)</label><input id="ob_name" value="'+esc(p.name)+'" placeholder="e.g. Alex">'
 +'<label>Your sprint goal</label><input id="ob_goal" value="'+esc(p.goal)+'" placeholder="e.g. Launch my shop / Lose 6 kg / Finish my course">'
 +'<label>Day 1 — sprint start date</label><input id="ob_start" type="date" value="'+esc(p.startDate||todayISO())+'">'
 +'<label>Currency</label><input id="ob_cur" value="'+esc(p.currency||'$')+'" style="max-width:110px">'
 +'<label>Theme</label><select id="ob_theme">'+THEMES.map(t=>'<option value="'+t[0]+'" '+(p.theme===t[0]?'selected':'')+'>'+t[1]+'</option>').join('')+'</select>'
 +'<p style="font-size:12.5px;color:var(--muted);margin-top:13px;line-height:1.55">🔒 Privacy: everything you write stays in this browser, on this device. Nothing is uploaded anywhere. Export backups from Settings.</p>'
 +'<div class="row" style="margin-top:15px"><button class="btn" onclick="finishOnboard(false)">🏁 Start my sprint</button><button class="btn ghost" onclick="finishOnboard(true)">Skip for now</button></div>';
 $('#onboard').classList.add('open'); }
function finishOnboard(skip){ if(!skip){ S.profile.name=$('#ob_name').value.trim(); S.profile.goal=$('#ob_goal').value.trim(); S.profile.startDate=$('#ob_start').value||todayISO(); S.profile.currency=$('#ob_cur').value.trim()||'$'; S.profile.theme=$('#ob_theme').value; if(S.profile.goal && !S.goals.length) S.goals.push({id:uid(), title:S.profile.goal, measure:'', target:'', why:''}); }
 if(!S.profile.startDate) S.profile.startDate=todayISO(); S.profile.onboarded=true; save(); applyTheme(); $('#onboard').classList.remove('open'); render(); toast('🏁 Sprint set — Day '+Math.max(1,curDay())+' energy!'); }
/* ============ GLOBAL INPUT BINDING (autosave on input) ============ */
function setPath(obj, path, val){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ if(o[parts[i]]===undefined) o[parts[i]]={}; o=o[parts[i]]; } o[parts[parts.length-1]]=val; }
document.addEventListener('input', e=>{ const el=e.target;
 if(el.dataset.bind){ setPath(S, el.dataset.bind, el.value); save(); }
 if(el.dataset.day && el.dataset.top3!==undefined){ const dy=ensureDay(+el.dataset.day); dy.top3[+el.dataset.top3].t=el.value; save(); }
 else if(el.dataset.day && el.dataset.f){ const dy=ensureDay(+el.dataset.day); dy[el.dataset.f]=el.value; save(); }
 if(el.dataset.week){ S.weeklyPlan[el.dataset.week]=S.weeklyPlan[el.dataset.week]||{focus:'',plan:''}; S.weeklyPlan[el.dataset.week][el.dataset.f]=el.value; save(); }
 if(el.dataset.wrev){ const w=el.dataset.wrev; S.weeklyReview[w]=S.weeklyReview[w]||{went:'',didnt:'',lesson:'',score:''}; S.weeklyReview[w][el.dataset.f]= el.dataset.f==='score'? (el.value===''? '': Math.min(100,Math.max(0,+el.value))) : el.value; save(); }
});
document.addEventListener('change', e=>{ const el=e.target; if(el.dataset.day && el.dataset.f && el.tagName==='SELECT'){ const dy=ensureDay(+el.dataset.day); dy[el.dataset.f]=el.value; save(); } });
/* ============ RENDER DISPATCH ============ */
const RENDER={home:renderHome, bridge:renderBridge, goal:renderGoal, milestones:renderMilestones, monthly:renderMonthly, premortem:renderPremortem, board:renderBoard, score:renderScore, habits:renderHabits, daily:renderDaily, weeklyplan:renderWeeklyPlan, weeklyreview:renderWeeklyReview, midpoint:renderMidpoint, rescue:renderRescue, wellness:renderWellness, rewards:renderRewards, timer:renderTimer, forecast:renderForecast, final:renderFinal, certificate:renderCertificate, next90:renderNext90, notes:renderNotes, calendar:renderCalendar, settings:renderSettings};
function render(){ buildSidebar(); const fn=RENDER[currentSection]||renderHome; $('#main').innerHTML=fn();
 if(currentSection==='certificate' && progressPct()>=100 && !S._confDone){ S._confDone=true; setTimeout(confetti,350); } }
/* ============ INIT ============ */
load();
if(DEMO){ S=sampleState(); document.title='90-Day Sprint Planner — DEMO (nothing saves)'; const b=document.createElement('div'); b.style.cssText='background:#D64545;color:#fff;text-align:center;padding:8px;font-weight:700;font-size:14px;position:sticky;top:0;z-index:60'; b.textContent='🎬 DEMO — sample sprint shown; nothing you change here is saved.'; document.body.prepend(b); if(new URLSearchParams(location.search).has('clean')) b.style.display='none'; }
applyTheme();
$('#menubtn').onclick=()=> $('#sidebar').classList.toggle('open');
$('#themebtn').onclick=()=>{ openModal('<h3>🎨 Themes — 10 fresh colours</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+THEMES.map(t=>'<button class="chip" style="cursor:pointer;padding:10px 15px;'+(S.profile.theme===t[0]?'background:var(--accent);color:#fff':'')+'" onclick="setTheme(\''+t[0]+'\');closeModal()">'+t[1]+'</button>').join('')+'</div><label style="margin-top:15px">Colourful mode</label><button class="btn soft" onclick="S.profile.colourful=!S.profile.colourful;save();applyTheme();closeModal();render()">Colourful: '+(S.profile.colourful?'ON':'OFF')+'</button>'); };
$('#printbtn').onclick=()=> window.print();
$('#avatar').onclick=()=> $('#avatarFile').click();
$('#avatarFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ S.profile.photo=r.result; save(); applyTheme(); toast('📷 Profile photo set'); }; r.readAsDataURL(f); };
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
$('#infomodal').addEventListener('click', e=>{ if(e.target.id==='infomodal') e.target.classList.remove('open'); });
bindTimerOverlay();
currentSection= S.lastSection && RENDER[S.lastSection]? S.lastSection:'home';
render();
if(!DEMO && !S.profile.onboarded) showOnboard();
if(!DEMO && S.lastBackup && Date.now()-S.lastBackup>30*86400000) setTimeout(()=>toast('⏰ 30+ days since your last backup — export one in Settings'), 1500);
</script></body></html>
