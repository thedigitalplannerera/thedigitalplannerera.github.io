<!DOCTYPE html>
<html lang="en" data-theme="sprintcream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO — Study Worksheets — Practice & Revision Engine — The Digital Planner Era</title>
<style>
:root{
  --bg:#FAF7EE; --card:#FFFFFF; --ink:#16294D; --muted:#66779A; --line:#E3DCC8;
  --accent:#1D4ED8; --accent2:#A3C614; --accent-soft:#E3EBFD; --good:#1E9E6A; --bad:#D64545; --warn:#E8871E;
  --grad:linear-gradient(120deg,#1D4ED8,#3B82F6); --shadow:0 8px 24px rgba(20,50,120,.10); --radius:16px;
}
html[data-theme="midnightlibrary"]{--bg:#0E1830;--card:#18264A;--ink:#EAF0FF;--muted:#9DB1DC;--line:#27386B;--accent:#7CA6FF;--accent2:#C6E265;--accent-soft:#1F3160;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="royalink"]{--bg:#131022;--card:#211A3E;--ink:#F0EDFF;--muted:#AEA4DC;--line:#352B5E;--accent:#A78BFA;--accent2:#A3C614;--accent-soft:#2A2150;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="forestacademia"]{--bg:#0F241A;--card:#1A3A2A;--ink:#EBF7EF;--muted:#9DC4AC;--line:#2A5240;--accent:#5ED598;--accent2:#E9C46A;--accent-soft:#21452F;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="charcoalchalk"]{--bg:#1C1C1E;--card:#2A2A2E;--ink:#F4F4F0;--muted:#B5B5AC;--line:#3D3D42;--accent:#E9C46A;--accent2:#7CA6FF;--accent-soft:#33332A;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="plumscholar"]{--bg:#2B1030;--card:#3D1745;--ink:#FBEFFD;--muted:#D3A6DC;--line:#52255E;--accent:#E58BE8;--accent2:#A3C614;--accent-soft:#481E52;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="skylecture"]{--bg:#EDF5FF;--card:#FFFFFF;--ink:#173A5E;--muted:#64819F;--line:#D2E4F7;--accent:#2272C9;--accent2:#F5A301;--accent-soft:#DCEBFC}
html[data-theme="mintmargin"]{--bg:#EFFAF3;--card:#FFFFFF;--ink:#14352A;--muted:#5E8A74;--line:#CFEDDB;--accent:#0E9F6E;--accent2:#1D4ED8;--accent-soft:#D9F5E4}
html[data-theme="peachnotes"]{--bg:#FFF4EA;--card:#FFFFFF;--ink:#4A2C14;--muted:#A97E56;--line:#F5DEC4;--accent:#E85D04;--accent2:#1D4ED8;--accent-soft:#FFE8D1}
html[data-theme="lavenderlecture"]{--bg:#F4F0FD;--card:#FFFFFF;--ink:#33255C;--muted:#8B7BB8;--line:#E0D6F5;--accent:#7C4DFF;--accent2:#A3C614;--accent-soft:#EAE2FD}
html[data-colourful="off"]{--accent2:var(--accent)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{resize:vertical;min-height:56px}
label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin:12px 0 5px}
#bgphoto{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.16;pointer-events:none;z-index:0}
#appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:2px solid var(--line)}
#appbar .logo{font-size:21px}
#appbar .ttl{font-weight:800;font-size:16.5px;line-height:1.1}
#appbar .ttl small{display:block;font-size:11px;color:var(--muted);font-weight:600}
#appbar .sp{flex:1}
.ava{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden;cursor:pointer;border:2.5px solid var(--accent2);flex:none;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.ava:hover::after{content:'📷';position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:15px}
.iconbtn{background:var(--accent-soft);border:none;border-radius:11px;padding:9px 12px;font-size:16px;color:var(--ink)}
.iconbtn:hover{background:var(--accent);color:#fff}
#shell{display:flex;max-width:1280px;margin:0 auto;position:relative;z-index:1}
#sidebar{width:238px;flex:none;padding:16px 10px;display:none}
#sidebar.open{display:block}
@media(min-width:900px){#sidebar{display:block;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}}
@media(max-width:899px){#sidebar{position:fixed;left:0;top:62px;bottom:0;background:var(--card);z-index:35;box-shadow:var(--shadow)}}
#sidebar a{display:flex;gap:9px;align-items:center;padding:8.5px 11px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px}
#sidebar a:hover{background:var(--accent-soft)}
#sidebar a.on{background:var(--grad);color:#fff}
#sidebar .grp{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:13px 11px 5px;text-transform:uppercase}
main{flex:1;padding:18px 16px 70px;min-width:0}
.hero{background:var(--grad);border-radius:20px;color:#fff;padding:24px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'🎓';position:absolute;right:14px;top:8px;font-size:64px;opacity:.22}
.hero h1{font-size:27px;line-height:1.15}
.hero .sub{opacity:.92;margin-top:5px;font-size:14.5px}
.daycount{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:rgba(255,255,255,.3)}
.ring .pr{stroke:#FFD166;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{fill:#fff;font-weight:800;font-size:19px}
.pacebadge{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);padding:9px 14px;border-radius:12px;font-weight:800;font-size:15px}
.quickrow{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.qbtn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 15px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:var(--shadow)}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px;margin-top:8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .ic{font-size:27px}
.card h3{font-size:16px;margin:8px 0 4px}
.card p{font-size:13px;color:var(--muted);line-height:1.45}
.card .bar{height:7px;background:var(--accent-soft);border-radius:5px;margin-top:11px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.card .pct{font-size:11.5px;font-weight:800;color:var(--accent);margin-top:5px}
.secttl{display:flex;align-items:center;gap:11px;margin-bottom:6px;flex-wrap:wrap}
.secttl h2{font-size:23px}
.secttl .sp{flex:1}
.infobtn{margin-left:auto;background:var(--accent2);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;box-shadow:var(--shadow)}
.backbtn{background:none;border:none;font-size:15px;font-weight:700;color:var(--accent);padding:6px 0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.panel h3{font-size:16.5px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.btn{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-weight:800;font-size:14.5px}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:#D64545}
.btn:disabled{opacity:.5}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3.5px 11px;font-size:12px;font-weight:800;margin:2px 3px 2px 0}
.chip.amber{background:#FDEBC8;color:#8A5A00}
html[data-theme$="violet"] .chip.amber,html[data-theme="midnightamber"] .chip.amber,html[data-theme="plumroyale"] .chip.amber,html[data-theme="indigonight"] .chip.amber,html[data-theme="charcoalgold"] .chip.amber{background:#4A3603;color:#FFD166}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:9px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15px}
.item .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.mini{background:none;border:none;font-size:16px;padding:4px}
.tick{width:27px;height:27px;flex:none;border-radius:9px;border:2px solid var(--accent);background:var(--card);font-size:15px;color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tick.on{background:var(--accent);color:#fff}
.done-t{text-decoration:line-through;opacity:.55}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);margin-top:14px;font-size:14.5px;line-height:1.55}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal h3{font-size:19px;margin-bottom:8px}
.modal .x{float:right;background:none;border:none;font-size:20px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:99;transition:transform .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.paceline{height:16px;background:var(--accent-soft);border-radius:9px;position:relative;margin:10px 0 4px}
.paceline .ideal{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted);border-radius:2px}
.paceline .actual{height:100%;background:var(--grad);border-radius:9px}
table.cal{width:100%;border-collapse:collapse;margin-top:8px}
table.cal th{font-size:11.5px;color:var(--muted);padding:5px 2px;text-transform:uppercase}
table.cal td{border:1px solid var(--line);height:52px;vertical-align:top;padding:4px;font-size:12px;width:14.28%}
table.cal td .dn{font-weight:800;font-size:13px}
table.cal td.sprint{background:var(--accent-soft)}
table.cal td.today{outline:2.5px solid var(--accent2);outline-offset:-2px}
table.cal td{cursor:pointer}
.hgrid{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.hgrid .cell{width:19px;height:19px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--line);cursor:pointer;font-size:0}
.hgrid .cell.on{background:var(--accent)}
.hgrid .cell.today{outline:2px solid var(--accent2)}
.hgrid .cell.future{opacity:.35;cursor:default}
.scorebig{font-size:44px;font-weight:900;line-height:1}
.cert{background:linear-gradient(135deg,#FFFDF5,#FBF3DC);color:#2A2140;border:3px solid #C9A227;border-radius:14px;padding:34px 26px;text-align:center;position:relative}
.cert::before{content:'';position:absolute;inset:9px;border:1.5px solid #C9A227;border-radius:9px;pointer-events:none}
.cert h2{font-family:Georgia,serif;font-size:31px;color:#6C2BD9}
.cert .nm{font-family:Georgia,serif;font-size:27px;font-weight:700;margin:10px 0}
.paper{background:var(--card);border:1.5px solid var(--line);border-radius:12px;min-height:300px;padding:14px;margin-top:10px}
.paper.lined{background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 28px)}
.paper.dotted{background-image:radial-gradient(var(--line) 1.3px,transparent 1.4px);background-size:22px 22px}
.paper.gridp{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.paper textarea{background:transparent;border:none;width:100%;min-height:280px;line-height:28px;font-size:15px}
.paper textarea:focus{outline:none}
.honest{text-align:center;color:var(--muted);font-size:12.5px;margin-top:34px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-top:14px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.kpi b{font-size:23px;display:block}
.kpi span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
svg text{font-family:inherit}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:3px;width:104px;padding:13px 6px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-size:12px;font-weight:700}
.badge .bi{font-size:29px}
.badge.off{opacity:.38;filter:grayscale(1)}
#timerov{position:fixed;inset:0;background:#1D1233;color:#fff;display:none;z-index:90;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#timerov.open{display:flex}
#timerov .clock{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums}
@media print{ #appbar,#sidebar,.quickrow,.infobtn,.backbtn,#toast,.noprint{display:none!important} body{background:#fff} main{padding:0} .panel,.card{box-shadow:none} }
</style>
</head>
<body>
<div id="bgphoto"></div>
<header id="appbar">
  <button class="iconbtn" id="menubtn" title="Menu">☰</button>
  <div class="logo">🎓</div>
  <div class="ttl">Study Engine<small>THE DIGITAL PLANNER ERA</small></div>
  <div class="sp"></div>
  <button class="iconbtn" id="themebtn" title="Themes & colours">🎨</button>
  <button class="iconbtn" id="printbtn" title="Print this section">🖨️</button>
  <div class="ava" id="avatar" title="Your profile photo — tap to change">S</div>
  <input type="file" id="avatarFile" accept="image/*" style="display:none">
</header>
<div id="shell">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="modal" id="infomodal"><div class="box" id="infobox"></div></div>
<div id="timerov">
  <div style="font-size:19px;font-weight:700" id="ovlabel">Focus Sprint</div>
  <div class="clock" id="ovclock">25:00</div>
  <div style="opacity:.85" id="ovgoal"></div>
  <div class="row" style="max-width:340px;width:90%">
    <button class="btn" id="ovpause" style="flex:1">⏸ Pause</button>
    <button class="btn ghost" id="ovend" style="flex:1;background:transparent;color:#fff;border-color:#fff">⏹ End & log</button>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="onboard"><div class="box" id="onboardbox"></div></div>
<script>
/* ============ STUDY ENGINE — CORE ============ */
const LS_KEY='studyEngine_v1';
const DEMO = document.title.includes('DEMO');
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=> 'id'+Math.random().toString(36).slice(2,9);
const esc=s=> String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{ if(!iso) return '—'; const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const addDays=(iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysUntil=iso=> Math.round((new Date(iso+'T12:00:00')-new Date(todayISO()+'T12:00:00'))/86400000);
const THEMES=[
 ['examcream','🎓 Exam Cream','light'],['midnightlibrary','🌙 Midnight Library','dark'],
 ['skylecture','☁️ Sky Lecture','light'],['royalink','👑 Royal Ink','dark'],
 ['mintmargin','🌿 Mint Margin','light'],['forestacademia','🌲 Forest Academia','dark'],
 ['peachnotes','🍑 Peach Notes','light'],['charcoalchalk','🖤 Charcoal Chalk','dark'],
 ['lavenderlecture','💜 Lavender Lecture','light'],['plumscholar','📚 Plum Scholar','dark']];
const BOXDAYS={1:1,2:2,3:4,4:7,5:14};
function blankState(){ return {
 profile:{name:'',school:'',examDate:'',theme:'examcream',accent:'',colourful:true,photo:'',onboarded:false},
 subjects:[], topics:[], cards:[], tests:[], mistakes:[], exams:[],
 cornell:[], blurting:[], feynman:[], pqlog:[], reading:[], sessions:[],
 mindmap:{center:'', nodes:[]}, autoPlans:{}, weekFocus:{},
 activity:{}, stats:{reviews:0}, notes:{paper:'lined',text:''},
 lastBackup:'', lastSection:'home', createdAt:Date.now() }; }
let S;
function save(){ if(DEMO) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=Object.assign(blankState(), JSON.parse(raw)); return; } }catch(e){} S=blankState(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function openModal(html){ $('#modalbox').innerHTML='<button class="x" onclick="closeModal()">✕</button>'+html; $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }
function confirmBox(msg, fn){ openModal('<h3>Are you sure?</h3><p style="line-height:1.55">'+esc(msg)+'</p><div class="row" style="margin-top:16px"><button class="btn danger" id="cfYes">Yes, do it</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>'); $('#cfYes').onclick=()=>{ closeModal(); fn(); }; }
function markActivity(){ S.activity[todayISO()]=true; }
/* ---- study maths ---- */
function dueCards(){ const t=todayISO(); return S.cards.filter(c=>c.due<=t); }
function subjName(id){ const s=S.subjects.find(x=>x.id===id); return s? s.name:'General'; }
function topicsPct(subjectId){ const ts=S.topics.filter(t=>!subjectId||t.subjectId===subjectId); if(!ts.length) return null; return Math.round(ts.filter(t=>t.status==='mastered').length/ts.length*100); }
function boxPct(subjectId){ const cs=S.cards.filter(c=>!subjectId||c.subjectId===subjectId); if(!cs.length) return null; return Math.round(cs.reduce((a,c)=>a+c.box,0)/cs.length/5*100); }
function testPct(subjectId){ const ts=S.tests.filter(t=>!subjectId||t.subjectId===subjectId); const scored=ts.filter(t=>t.items && t.items.length && t.items.every(i=>i.ok!==null&&i.ok!==undefined)); if(!scored.length) return null; const avgs=scored.map(t=> t.items.filter(i=>i.ok).length/t.items.length*100); return Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length); }
function readiness(subjectId){ const parts=[[topicsPct(subjectId),0.4],[boxPct(subjectId),0.3],[testPct(subjectId),0.3]].filter(p=>p[0]!==null); if(!parts.length) return null; const wsum=parts.reduce((a,p)=>a+p[1],0); return Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/wsum); }
function overallReadiness(){ return readiness(null); }
function streaks(){ let cur=0; let d=todayISO(); if(!S.activity[d]) d=addDays(d,-1); while(S.activity[d]){ cur++; d=addDays(d,-1); } let best=0,run=0; const days=Object.keys(S.activity).sort(); let prev=null; days.forEach(day=>{ if(prev && addDays(prev,1)===day) run++; else run=1; best=Math.max(best,run); prev=day; }); return {cur,best}; }
function pqAccuracy(){ const t=S.pqlog.reduce((a,p)=>a+(+p.attempted||0),0), c=S.pqlog.reduce((a,p)=>a+(+p.correct||0),0); return t? Math.round(c/t*100):null; }
/* ---- INFO (📝 per page) ---- */
const INFO={
 home:['Your Study Dashboard','This is the engine room: how many Leitner cards are due today, your Exam Readiness per subject, and what to practise next. This app is a PRACTICE engine — not a planner. Planning lives in your timetable; getting things INTO your memory happens here.','Start every study day here. Clear the due queue first — those reviews are the ones your memory is about to lose.','Memory fades on a curve. Reviewing at the right moment is the single highest-value study habit there is.'],
 subjects:['My Subjects & Topics','Your subjects, and inside each, the topics your exam will test. Mark topics Learning or Mastered as you go — topic mastery is 40% of your Readiness Score.','Add subjects first, then topics under each. Be honest with "Mastered" — it means you could answer exam questions on it cold.','Readiness you can trust starts with an honest map of what the exam actually covers.'],
 leitner:['The Leitner Engine — Box 1 to Box 5','Every flashcard lives in a box. Answer right and it climbs (reviews get rarer: 1, 2, 4, 7, 14 days). Answer wrong and it drops back to Box 1, where you will see it tomorrow. The engine schedules every review for you.','Press Review Due Cards and be honest: Got it / Missed it. No peeking before you answer — the struggle IS the learning.','Spaced repetition is the most proven memory technique in study science. The boxes simply make it automatic.'],
 flashcards:['Flashcards — Card Builder','Make cards from your topics: a question or cue on the front, the answer on the back. New cards start in Box 1, due today.','Keep cards tiny — one fact per card. "Explain photosynthesis" is a topic; "What gas do plants release?" is a card.','Small cards reviewed often beat big notes read once. Your future self will thank you at Box 5.'],
 tests:['Recall Tests — Self-Checking','Build a test from questions, write YOUR answer from memory, then check it against the key and mark yourself honestly. Scores feed your Readiness automatically.','Write answers BEFORE looking at the key — that is the whole point. Mark strictly; a generous mark today is a lost mark in the exam hall.','Testing yourself is not measuring learning — it IS learning. Retrieval practice beats re-reading by a wide margin.'],
 mistakes:['Mistake Log → Retest Queue','Every mistake you log can become a Box-1 flashcard with one tap. It keeps resurfacing until you clear it twice in a row — then it is officially beaten.','Log mistakes the day you make them (from tests, homework, past papers). Tap "Make retest card" and let the loop do its work.','A mistake you revisit is tuition paid once. A mistake you ignore is tuition you will pay again in the exam.'],
 readiness:['Exam Readiness — Live %','One forward-looking number per exam: topics mastered (40%) + Leitner box levels (30%) + recall test scores (30%), against the days left. Rivals\' scores look back at grades; this one looks forward at the exam.','Nothing to fill in — study in the other sections and watch it move. A subject with no data shows "—": add topics and cards to wake it.','You cannot manage what you cannot see. Readiness turns "I should study more" into "Biology is at 62% — fix that first".'],
 autoplan:['Countdown Auto-Plan','Pick an exam and the engine builds your count-back: 4 weeks out (cover everything), 2 weeks (tests + mistake loop), 1 week (box reviews only), exam eve (light + logistics).','Generate the plan, then tick phases as you complete them. Regenerate any time your exam date changes.','Exams are lost in the last month, not the last night. A count-back plan makes the last month boring — in the best way.'],
 cornell:['Cornell Notes','The classic split page: notes on the right, questions/cues on the left, a summary at the bottom written in your own words.','Take notes in the big area during class; add cue questions later; write the summary last — that summary is where understanding happens.','Cornell works because the cue column turns your notes into a self-test — the engine\'s favourite trick.'],
 blurting:['Blurting Practice','Close the book. Write EVERYTHING you remember about a topic, in any order, without stopping. Then open the book and write what you missed — those gaps are your next cards.','Pick a topic, set your own pace (5–10 minutes is plenty), blurt, then record the gaps honestly.','Blurting feels messy because it is honest. The gaps it exposes are exactly what revision should target.'],
 feynman:['Feynman Studio — Teach It Back','Explain a topic in simple words, as if teaching a 12-year-old. Where your explanation gets wobbly is exactly where your understanding is thin.','Write the simple explanation, note the stuck points, then go back to your notes for just those points and try again.','If you cannot explain it simply, you do not know it yet — you only recognise it. Feynman closes that gap.'],
 pqlog:['Practice-Question Log','Track the questions you attempt from past papers and workbooks: how many, how many right. Accuracy over time is the truest exam predictor you own.','Log a line after each practice set — source, attempted, correct. Watch accuracy climb per subject.','Exams are questions. Practising questions, and counting honestly, is practising the exam itself.'],
 reading:['Reading Log','Pages and chapters read, with minutes. Reading builds the base that cards and tests then lock in.','Log each reading session. Pair it with 2–3 new flashcards while the chapter is fresh.','Reading without retrieval fades; reading followed by cards becomes knowledge. Log both halves.'],
 mindmap:['Mind-Map Canvas','A simple board for connecting ideas: one centre topic, branches you add around it. Seeing the shape of a topic helps you recall its parts under pressure.','Set the centre, add branches (double-tap a spot in your head, type the branch). Keep it to one topic per map — screenshot or print it for your wall.','Exams reward connected knowledge, not lists. A map shows you the connections before the examiner asks for them.'],
 sessions:['Study Sessions & Focus Timer','A Pomodoro timer (25/5/15) with Focus Mode, plus a session log with a focus rating for every session — because an honest hour beats three distracted ones.','Start the timer, study one thing, rate your focus when it ends. Timer sessions log themselves; add manual sessions too.','Focus is a skill with a score. Rating it makes it visible — and what is visible improves.'],
 schedule:['Weekly Study Schedule','Your week, driven by the queue: how many cards fall due each day, your exam countdowns, and a focus line for the week. 16 weekly pages per term, generated for you.','Glance each morning; set the week focus on Monday. Heavy due-days deserve lighter new material.','A schedule built from what is actually due beats a timetable built from wishes.'],
 exams:['Exam Centre','Every exam in one place: date, countdown, room, seat, and the materials checklist — so exam morning has zero surprises left in it.','Add each exam as soon as you know it. Fill logistics when the school publishes them, not the night before.','Calm is a competitive advantage. Logistics settled early frees your last week for pure revision.'],
 marks:['Marks Calculator — What Do I Need?','Enter your current coursework %, how much the final is worth, and the grade you want. The calculator tells you exactly what the final must be — and whether it is still possible.','Use real numbers from your school portal. If the answer is over 100%, the honest move is to re-target early, not to hope.','A clear target turns anxiety into arithmetic — and arithmetic into a plan.'],
 progress:['Progress & Wins','Your story so far: test-score history, study streaks, cards reviewed, and badges earned from real data.','Visit on hard days. This page is the evidence that the work is working.','Motivation follows proof. Small wins, counted, compound into exam-day confidence.'],
 notes:['Notes','Free paper in three styles — lined, dotted, grid — for workings, lists and thinking on paper.','Switch styles any time; your text stays. Prints cleanly too.','Not every thought needs a system. Some need a blank page and five quiet minutes.'],
 calendar:['Study Calendar','Your term at a glance: exams, and how many reviews fall due each day. Tap an exam day to jump to the Exam Centre.','Export exams as .ics to drop them into your phone calendar.','Seeing the whole term keeps one bad day in proportion — and one exam from ambushing you.'],
 guide:['Guide & Worked Example','How this engine works, the five methods inside it, and how a worked example subject is set up in the free demo file.','Read once at the start. When a method confuses you later, its 📝 guide (top corner of every page) explains it again, in place.','Systems beat willpower. Ten minutes understanding the system saves ten hours of random revision.'],
 settings:['Settings','Themes, accent colour, background photo, backups and printing. Your data lives only in this browser, on this device — export a backup to keep it safe.','Export a backup every few weeks (the app reminds you after 30 days). Import restores everything.','Tools serve the student. Set it once, then get back to the books.']};

let navStack=[];
let currentSection='home';
function go(id, push=true){ if(push && currentSection && currentSection!==id) navStack.push(currentSection); currentSection=id; S.lastSection=id; save(); render(); window.scrollTo(0,0); $('#sidebar').classList.remove('open'); }
function backNav(){ const prev=navStack.pop(); currentSection= prev || 'home'; S.lastSection=currentSection; save(); render(); window.scrollTo(0,0); }
function infoBtn(id){ return '<button class="infobtn" title="About this page" onclick="showInfo(\''+id+'\')">📝</button>'; }
function showInfo(id){ const t=INFO[id]||INFO.home; $('#infobox').innerHTML='<button class="x" onclick="document.querySelector(\'#infomodal\').classList.remove(\'open\')">✕</button><h3>📝 '+esc(t[0])+'</h3><p style="line-height:1.6;margin-top:6px">'+esc(t[1])+'</p><p style="line-height:1.6;margin-top:10px"><b>How to use it:</b> '+esc(t[2])+'</p><p style="line-height:1.6;margin-top:10px"><b>Why it helps:</b> '+esc(t[3])+'</p>'; $('#infomodal').classList.add('open'); }
function secHead(id, icon, title, extra){ return '<div class="secttl">'+(id!=='home'?'<button class="backbtn" onclick="backNav()">← Back</button>':'')+'<h2>'+icon+' '+esc(title)+'</h2>'+(extra||'')+infoBtn(id)+'</div>'; }
function buildSidebar(){ const groups=[['ENGINE',['home','leitner','flashcards','tests','mistakes']],['SCORE',['readiness','autoplan','exams','marks']],['METHODS',['subjects','cornell','blurting','feynman','mindmap']],['PRACTICE',['pqlog','reading','sessions','schedule']],['MORE',['progress','notes','calendar','guide','settings']]];
 $('#sidebar').innerHTML= groups.map(([g,ids])=>'<div class="grp">'+g+'</div>'+ids.map(id=>{ const s=SECTIONS.find(x=>x[0]===id); return '<a href="#" data-sec="'+id+'" class="'+(currentSection===id?'on':'')+'" onclick="go(\''+id+'\');return false">'+s[1]+' '+esc(s[2])+'</a>'; }).join('')).join(''); }
function applyTheme(){ document.documentElement.dataset.theme=S.profile.theme||'examcream'; document.documentElement.dataset.colourful=S.profile.colourful?'on':'off'; if(S.profile.accent) document.documentElement.style.setProperty('--accent', S.profile.accent); else document.documentElement.style.removeProperty('--accent');
 $('#bgphoto').style.backgroundImage= S.profile.photo? 'url('+S.profile.photo+')':'';
 const av=$('#avatar'); av.innerHTML= S.profile.photo? '<img src="'+S.profile.photo+'">': esc((S.profile.name||'S').trim().charAt(0).toUpperCase()||'S'); }
/* ============ HOME ============ */
function sectionProgress(id){ switch(id){
 case 'subjects': { const p=topicsPct(null); return p===null?0:p/100; }
 case 'leitner': case 'flashcards': { const p=boxPct(null); return p===null?0:p/100; }
 case 'tests': { const p=testPct(null); return p===null?0:p/100; }
 case 'mistakes': { if(!S.mistakes.length) return 0; return S.mistakes.filter(m=>m.status==='cleared').length/S.mistakes.length; }
 case 'readiness': { const r=overallReadiness(); return r===null?0:r/100; }
 case 'exams': return Math.min(1,S.exams.length/2);
 case 'pqlog': { const a=pqAccuracy(); return a===null?0:a/100; }
 case 'sessions': return Math.min(1, S.sessions.length/10);
 case 'cornell': return Math.min(1,S.cornell.length/3);
 case 'blurting': return Math.min(1,S.blurting.length/3);
 case 'feynman': return Math.min(1,S.feynman.length/3);
 case 'reading': return Math.min(1,S.reading.length/5);
 default: return 0; } }
function ringSVG(pct, label){ const C=2*Math.PI*40; return '<div style="text-align:center"><svg class="ring" viewBox="0 0 92 92" style="width:84px;height:84px"><circle class="tr" cx="46" cy="46" r="40" style="stroke:var(--accent-soft)"></circle><circle class="pr" cx="46" cy="46" r="40" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-(pct||0)/100))+'" style="stroke:var(--accent2)"></circle><text x="46" y="52" text-anchor="middle" style="fill:var(--ink);font-size:19px">'+(pct===null||pct===undefined?'—':pct+'%')+'</text></svg><div style="font-size:12.5px;font-weight:700;color:var(--muted)">'+esc(label)+'</div></div>'; }
function renderHome(){ const due=dueCards(); const st=streaks(); const nextExam=[...S.exams].filter(e=>daysUntil(e.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0];
 let attention=[]; if(!S.subjects.length) attention.push('📚 No subjects yet — add your first subject to start the engine.');
 if(due.length) attention.push('🗂️ '+due.length+' Leitner card'+(due.length===1?' is':'s are')+' due today — memory fades; review first.');
 if(S.mistakes.filter(m=>m.status!=='cleared').length) attention.push('🔁 '+S.mistakes.filter(m=>m.status!=='cleared').length+' mistake(s) still in the retest loop.');
 if(nextExam && daysUntil(nextExam.date)<=14) attention.push('🎓 '+esc(nextExam.title)+' in '+daysUntil(nextExam.date)+' days — Countdown Auto-Plan time.');
 if(!attention.length) attention.push('✅ Queue clear. Add new cards or take a recall test to keep the engine fed.');
 let h='<div class="hero"><h1>'+(S.profile.name? 'Keep going, '+esc(S.profile.name.split(' ')[0]) : 'Your Practice Engine')+'</h1><div class="sub">Not a planner — an engine that puts the work INTO your memory. '+(S.profile.school? esc(S.profile.school)+' · ':'')+'🔥 '+st.cur+'-day study streak</div>'
 +'<div class="daycount"><div class="pacebadge">🗂️ DUE TODAY: '+due.length+' card'+(due.length===1?'':'s')+'</div><div class="pacebadge">📈 READINESS: '+(overallReadiness()===null?'—':overallReadiness()+'%')+'</div>'+(nextExam? '<div class="pacebadge">🎓 '+esc(nextExam.title)+': '+daysUntil(nextExam.date)+' days</div>':'')+'</div></div>';
 h+='<div class="quickrow"><button class="qbtn" onclick="go(\'leitner\')">🗂️ Review Due ('+due.length+')</button><button class="qbtn" onclick="quickAddCard()">➕ Quick Add Card</button><button class="qbtn" onclick="go(\'sessions\')">⏱️ Focus Timer</button><button class="qbtn" onclick="window.print()">🖨️ Print</button><input id="homesearch" placeholder="🔍 Search sections…" style="flex:1;min-width:170px" oninput="filterCards(this.value)"></div>';
 if(S.subjects.length){ h+='<div class="panel"><h3>📈 Readiness by subject</h3><div style="display:flex;gap:20px;flex-wrap:wrap">'+S.subjects.map(s=>ringSVG(readiness(s.id), s.name)).join('')+'</div></div>'; }
 h+='<div class="panel"><h3>⚠️ Today\'s queue & attention</h3>'+attention.map(a=>'<div style="font-size:14.5px;padding:3px 0">'+a+'</div>').join('')+'</div>';
 h+='<div class="grid" id="cardgrid">'+SECTIONS.filter(s=>s[0]!=='home').map(s=>{ const pr=Math.round(sectionProgress(s[0])*100); return '<div class="card" data-name="'+esc(s[2].toLowerCase())+'" onclick="go(\''+s[0]+'\')"><div class="ic">'+s[1]+'</div><h3>'+esc(s[2])+'</h3><p>'+esc(s[3])+'</p><div class="bar"><i style="width:'+pr+'%"></i></div><div class="pct">'+pr+'%</div></div>'; }).join('')+'</div>';
 h+='<p class="honest">A study tool, not a promise — your results depend on the work you put in. Your data stays in this browser, on your device; export a backup from Settings to keep it safe. The Digital Planner Era.</p>';
 return h; }
function filterCards(q){ q=q.toLowerCase(); $$('#cardgrid .card').forEach(c=>{ c.style.display= c.dataset.name.includes(q)? '':'none'; }); }
function quickAddCard(){ openModal('<h3>➕ Quick Add Flashcard</h3><label>Subject</label><select id="qa_s">'+S.subjects.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><label>Front (question / cue)</label><input id="qa_f" placeholder="e.g. What gas do plants release?"><label>Back (answer)</label><input id="qa_b" placeholder="e.g. Oxygen"><div class="row" style="margin-top:16px"><button class="btn" onclick="quickAddCardSave()">Add to Box 1</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>'); if(!S.subjects.length){ closeModal(); toast('Add a subject first'); go('subjects'); } }
function quickAddCardSave(){ const f=$('#qa_f').value.trim(), b=$('#qa_b').value.trim(); if(!f||!b){ toast('Write both sides'); return; } S.cards.push({id:uid(), subjectId:$('#qa_s').value, front:f, back:b, box:1, due:todayISO(), clears:0}); markActivity(); save(); closeModal(); toast('🃏 Card added to Box 1 — due today'); render(); }
/* ============ SUBJECTS & TOPICS ============ */
function renderSubjects(){ let h=secHead('subjects','📚','My Subjects & Topics');
 if(!S.subjects.length) h+='<div class="empty">No subjects yet.<br>Add a subject (Biology, History, Maths…), then list its topics — the map your whole engine runs on.</div>';
 S.subjects.forEach(s=>{ const ts=S.topics.filter(t=>t.subjectId===s.id); h+='<div class="panel"><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">'+esc(s.name)+'</h3><span class="chip">📈 readiness '+(readiness(s.id)===null?'—':readiness(s.id)+'%')+'</span><span class="chip amber">'+ts.filter(t=>t.status==='mastered').length+'/'+ts.length+' topics mastered</span><span style="flex:1"></span><button class="mini" onclick="delSubject(\''+s.id+'\')">🗑️</button></div>'
 + ts.map(t=>'<div style="display:flex;gap:8px;align-items:center;margin-top:7px"><button class="tick '+(t.status==='mastered'?'on':'')+'" title="Toggle mastered" onclick="toggleTopic(\''+t.id+'\')">'+(t.status==='mastered'?'✓':'')+'</button><span class="'+(t.status==='mastered'?'done-t':'')+'" style="font-size:14.5px;flex:1">'+esc(t.title)+'</span><span class="chip">'+(t.status==='mastered'?'Mastered':'Learning')+'</span><button class="mini" onclick="delTopic(\''+t.id+'\')">🗑️</button></div>').join('')
 +'<div style="display:flex;gap:7px;margin-top:10px"><input id="tp_'+s.id+'" placeholder="Add a topic…" style="flex:1" onkeydown="if(event.key===\'Enter\')addTopic(\''+s.id+'\')"><button class="btn soft" onclick="addTopic(\''+s.id+'\')">+ Topic</button></div></div>'; });
 h+='<div class="panel"><h3>Add a subject</h3><div style="display:flex;gap:8px"><input id="sj_n" placeholder="e.g. Biology" onkeydown="if(event.key===\'Enter\')addSubject()"><button class="btn" onclick="addSubject()">➕ Add</button></div></div>'; return h; }
function addSubject(){ const t=$('#sj_n').value.trim(); if(!t) return; S.subjects.push({id:uid(), name:t}); save(); render(); }
function delSubject(id){ confirmBox('Delete this subject? Its topics, cards and data stay orphaned — topics/cards keep the old label.', ()=>{ S.subjects=S.subjects.filter(x=>x.id!==id); save(); render(); }); }
function addTopic(sid){ const inp=$('#tp_'+sid); const t=inp.value.trim(); if(!t) return; S.topics.push({id:uid(), subjectId:sid, title:t, status:'learning'}); save(); render(); }
function toggleTopic(id){ const t=S.topics.find(x=>x.id===id); t.status= t.status==='mastered'? 'learning':'mastered'; markActivity(); save(); render(); }
function delTopic(id){ S.topics=S.topics.filter(x=>x.id!==id); save(); render(); }
/* ============ LEITNER ENGINE ============ */
let reviewIdx=0, reviewFlipped=false;
function renderLeitner(){ let h=secHead('leitner','🗂️','Leitner Engine — Box 1 to Box 5'); const due=dueCards();
 h+='<div class="grid">'+[1,2,3,4,5].map(b=>{ const n=S.cards.filter(c=>c.box===b).length; const dn=S.cards.filter(c=>c.box===b&&c.due<=todayISO()).length; return '<div class="card" style="cursor:default"><div class="ic">'+['📥','📤','🗄️','🏛️','👑'][b-1]+'</div><h3>Box '+b+'</h3><p>'+n+' cards · review every '+BOXDAYS[b]+' day'+(BOXDAYS[b]>1?'s':'')+(dn?' · <b>'+dn+' due</b>':'')+'</p><div class="bar"><i style="width:'+(S.cards.length? n/S.cards.length*100:0)+'%"></i></div></div>'; }).join('')+'</div>';
 if(!S.cards.length) h+='<div class="empty">No cards yet — build some in Flashcards, and the engine starts scheduling.</div>';
 else if(!due.length) h+='<div class="panel" style="text-align:center"><div style="font-size:36px">🎉</div><h3>Queue clear — nothing due today</h3><p style="color:var(--muted)">Next reviews: '+esc(fmtDate(S.cards.map(c=>c.due).sort()[0]))+'. Add new cards or come back then.</p></div>';
 else { if(reviewIdx>=due.length) reviewIdx=0; const c=due[reviewIdx];
  h+='<div class="panel" style="text-align:center"><span class="chip">'+esc(subjName(c.subjectId))+'</span> <span class="chip amber">Box '+c.box+'</span> <span class="chip">Card '+(reviewIdx+1)+' of '+due.length+' due</span>'
  +'<div style="font-size:24px;font-weight:800;line-height:1.35;padding:26px 12px;min-height:110px">'+esc(reviewFlipped? c.back : c.front)+'</div>'
  +(!reviewFlipped? '<button class="btn" onclick="reviewFlipped=true;render()">👀 Flip — see the answer</button>' : '<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="answerCard(\''+c.id+'\',true)">✅ Got it — up a box</button><button class="btn danger" onclick="answerCard(\''+c.id+'\',false)">❌ Missed it — back to Box 1</button></div>')
  +'<p style="font-size:13px;color:var(--muted);margin-top:12px">Answer in your head (or out loud) BEFORE flipping. The struggle is the learning.</p></div>'; }
 h+='<div class="kpis"><div class="kpi"><b>'+S.cards.length+'</b><span>Total cards</span></div><div class="kpi"><b>'+S.stats.reviews+'</b><span>Reviews done</span></div><div class="kpi"><b>'+S.cards.filter(c=>c.box===5).length+'</b><span>At Box 5 👑</span></div><div class="kpi"><b>'+due.length+'</b><span>Due today</span></div></div>'; return h; }
function answerCard(id, right){ const c=S.cards.find(x=>x.id===id); if(!c) return;
 if(right){ c.box=Math.min(5, c.box+1); c.clears=(c.clears||0)+1; const mk=S.mistakes.find(m=>m.retestCardId===id && m.status!=='cleared'); if(mk){ mk.clears=(mk.clears||0)+1; if(mk.clears>=2){ mk.status='cleared'; toast('🔁 Mistake beaten — cleared twice!'); } } }
 else { c.box=1; c.clears=0; const mk=S.mistakes.find(m=>m.retestCardId===id && m.status!=='cleared'); if(mk) mk.clears=0; }
 c.due=addDays(todayISO(), BOXDAYS[c.box]); S.stats.reviews++; markActivity(); reviewFlipped=false; save(); render(); if(right) toast('✅ Box '+c.box+' — next review in '+BOXDAYS[c.box]+' day'+(BOXDAYS[c.box]>1?'s':'')); }
/* ============ FLASHCARDS ============ */
function renderFlashcards(){ let h=secHead('flashcards','🃏','Flashcards — Card Builder');
 if(!S.cards.length) h+='<div class="empty">No cards yet.<br>One fact per card: a question on the front, the answer on the back. New cards start in Box 1, due today.</div>';

function fmtClock(){ const m=Math.floor(timer.left/60), s=timer.left%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function setTimer(min,mode){ stopTimer(); timer.total=timer.left=min*60; timer.mode=mode; render(); }

function stopTimer(){ if(timer.iv) clearInterval(timer.iv); timer.iv=null; timer.run=false; }

function calcMarks(){ const cur=+$('#mc_cur').value||0, w=(+$('#mc_w').value||0)/100, tg=+$('#mc_tg').value||0; if(w<=0||w>1){ toast('Final weight must be 1–100%'); return; } const need=(tg - cur*(1-w))/w; const out=$('#mc_out');

 else if(need<=0) out.innerHTML='<div class="scorebig" style="color:var(--good)">0%</div><p style="margin-top:6px">You have already secured this grade on coursework alone. Everything on the final is upside — aim higher?</p>';

 h+='<div class="panel"><h3>💾 Backup & data</h3>'+(stale? '<p style="color:var(--warn);font-weight:700">⏰ Over 30 days since your last backup — export one now.</p>':'')+'<p style="font-size:14px;color:var(--muted);line-height:1.55">Last backup: '+(S.lastBackup? new Date(S.lastBackup).toLocaleDateString():'never')+'. Your data lives only in this browser — a backup file is your safety copy.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:11px"><button class="btn" onclick="exportBackup()">⬇ Export backup (JSON)</button><label class="btn ghost" style="margin:0;text-transform:none;letter-spacing:0;font-size:14.5px;cursor:pointer">⬆ Import backup<input type="file" accept=".json" style="display:none" onchange="importBackup(this)"></label>'+(DEMO? '<button class="btn soft" onclick="restoreSample()">↺ Restore sample</button>':'')+'<button class="btn danger" onclick="resetAll()">🗑️ Archive & reset everything</button></div></div>';
 h+='<div class="panel"><h3>🖨️ Print</h3><p style="font-size:14px;color:var(--muted);line-height:1.55">Print the section you are viewing with the 🖨️ button (top bar) — Readiness and Progress pages make great wall proof.</p><button class="btn soft" onclick="window.print()">🖨️ Print this page</button></div>'; return h; }
function setTheme(id){ S.profile.theme=id; save(); applyTheme(); render(); }
function setPhoto(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ S.profile.photo=r.result; save(); applyTheme(); toast('🖼️ Photo set'); render(); }; r.readAsDataURL(f); }
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportBackup(){ S.lastBackup=Date.now(); save(); download('study-engine-backup.json', JSON.stringify(S,null,2)); toast('⬇ Backup downloaded'); }
function importBackup(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.profile) throw 0; S=Object.assign(blankState(), j); save(); applyTheme(); toast('⬆ Backup restored'); go('home'); }catch(e){ toast('That file is not a study backup'); } }; r.readAsText(f); }
function resetAll(){ confirmBox('Archive & reset? All subjects, cards, tests and scores will be cleared. Export a backup first if you want to keep them.', ()=>{ const keepTheme=S.profile.theme; localStorage.removeItem(LS_KEY); S=blankState(); S.profile.theme=keepTheme; S.profile.onboarded=true; save(); applyTheme(); toast('🗑️ Fresh start — blank and ready'); go('home'); }); }
function restoreSample(){ localStorage.removeItem(LS_KEY); S=sampleState(); save(); applyTheme(); toast('↺ Sample restored'); go('home'); }

 S.profile.onboarded=true; save(); applyTheme(); $('#onboard').classList.remove('open'); toast('🎓 Engine ready — add your first subject'); render(); }

function setPath(path,val){ const parts=path.split('.'); let o=S; for(let i=0;i<parts.length-1;i++) o=o[parts[i]]; o[parts[parts.length-1]]=val; }
document.addEventListener('input', e=>{ const b=e.target.dataset.bind; if(b){ setPath(b, e.target.value); save(); if(b==='mindmap.center') {} return; }
 const cn=e.target.dataset.corn; if(cn){ const n=S.cornell.find(x=>x.id===cn); if(n){ n[e.target.dataset.f]=e.target.value; save(); } return; }
 const wf=e.target.dataset.weekfocus; if(wf!==undefined && wf!==null && e.target.hasAttribute('data-weekfocus')){ S.weekFocus[wf]=e.target.value; save(); return; }
 const tt=e.target.dataset.test; if(tt){ const t=S.tests.find(x=>x.id===tt); if(t){ t.items[+e.target.dataset.item][e.target.dataset.f]=e.target.value; save(); } return; } });
