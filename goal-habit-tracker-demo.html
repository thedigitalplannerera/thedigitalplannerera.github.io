.btn{background:var(--accent);color:#fff;border:none;border-radius:11px;padding:10px 16px;font-weight:700;font-size:14.5px;transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);filter:brightness(1.07)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#26190а;color:#26190A}

.small{font-size:12.5px}

table.grid-t{border-collapse:collapse;width:100%;font-size:12.5px}

.pix{display:grid;grid-template-columns:repeat(31,1fr);gap:2.5px}

.pix i.m1{background:#F2B8A0}.pix i.m2{background:#F6D492}.pix i.m3{background:#F9ECB8}.pix i.m4{background:#BFE3B4}.pix i.m5{background:#7FC98F}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.cal .cd.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold2) inset}
.cal .cd .n{font-weight:800;font-size:14px}
.ringwrap{position:relative;display:inline-block}
.ringwrap .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.searchbar{display:flex;gap:8px}
.kbd-num{font-size:30px;font-weight:800}
details.more{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:10px 14px;margin-bottom:10px}

textarea{min-height:74px;resize:vertical}
.note-paper{border-radius:10px;padding:12px;min-height:110px;background:var(--surface);border:1.5px solid var(--line);white-space:pre-wrap}

.note-dotted{background-image:radial-gradient(var(--line) 1.4px,transparent 1.5px);background-size:18px 18px}

#view{flex:1;min-width:0}

#sidebar button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);font-family:inherit;cursor:pointer}

.sec-head .infobtn{margin-left:auto;width:40px;height:40px;font-size:18px;flex:none}
.avatar{cursor:pointer}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.hcell{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}

.cal .cd{cursor:pointer}

 body{background:#fff!important}

let S;
function load(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw){ S = Object.assign(blankState(), JSON.parse(raw)); S.profile = Object.assign(blankState().profile, S.profile); S.settings = Object.assign(blankState().settings, S.settings); return; } }catch(e){} S = DEMO ? sampleState() : blankState(); }
function save(){ if(DEMO) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("Storage is full — export a backup from Settings."); } }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function confirmDo(msg, fn){ openModal(`<h3>Are you sure?</h3><p class="mut">${esc(msg)}</p><div class="row" style="margin-top:16px"><button class="btn danger" id="cfYes">Yes, continue</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`); $("#cfYes").onclick=()=>{ closeModal(); fn(); }; }
function openModal(html){ $("#modalRoot").innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ $("#modalRoot").innerHTML=""; }
function confetti(){ const c=$("#confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight; const cols=["#C9962C","#E9B44C","#0E6B5C","#3FBFA4","#F6D492"]; const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.4,w:6+Math.random()*6,h:8+Math.random()*8,vy:2.2+Math.random()*3,vx:-1.4+Math.random()*2.8,r:Math.random()*Math.PI,vr:-0.1+Math.random()*0.2,col:cols[Math.floor(Math.random()*cols.length)]})); let t0=performance.now(); (function anim(t){ const el=t-t0; x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); }); if(el<2600) requestAnimationFrame(anim); else x.clearRect(0,0,c.width,c.height); })(t0); }
function habitStreak(hid){ let n=0; let d=today(); if(!(S.habitLog[tkey()]||{})[hid]) d=addDays(d,-1); while((S.habitLog[dkey(d)]||{})[hid]){ n++; d=addDays(d,-1); } return n; }
function habitTotal(hid){ return Object.values(S.habitLog).filter(day=>day[hid]).length; }
function ladderOf(hid){ const t=habitTotal(hid); if(t>=150) return {name:"Gold",icon:"🥇",next:null}; if(t>=66) return {name:"Silver",icon:"🥈",next:150}; if(t>=21) return {name:"Bronze",icon:"🥉",next:66}; return {name:"Starter",icon:"🌱",next:21}; }
function dayDone(dateK){ const day=S.habitLog[dateK]||{}; return S.habits.filter(h=>day[h.id]).length; }
function liveScore(){ if(!S.habits.length && !S.goals.length) return 0; const yearStart=new Date(YEAR,0,1), yearEnd=new Date(YEAR,11,31); const now=today(); const upto = now<yearStart?yearStart:(now>yearEnd?yearEnd:now); const totalDays=Math.max(1,Math.round((upto-yearStart)/86400000)+1); let possible=0, done=0; for(let i=0;i<totalDays;i++){ const k=dkey(addDays(yearStart,i)); possible+=S.habits.length; done+=dayDone(k); } const habitScore = possible? done/possible : 0; const goalScore = S.goals.length? S.goals.reduce((a,g)=>a+(+g.progress||0),0)/(S.goals.length*100) : 0; const focusMin = S.focusLog.reduce((a,f)=>a+(+f.minutes||0),0); const focusScore = Math.min(1, focusMin/6000); const w = S.habits.length&&S.goals.length? [0.5,0.35,0.15] : (S.habits.length? [0.8,0,0.2] : [0,0.85,0.15]); return Math.round(100*(habitScore*w[0]+goalScore*w[1]+focusScore*w[2])); }
function areaScores(){ const out={}; AREAS.forEach(a=>{ const hs=S.habits.filter(h=>h.area===a); const gs=S.goals.filter(g=>g.area===a); if(!hs.length && !gs.length){ out[a]=null; return; } let parts=[]; if(hs.length){ const yearStart=new Date(YEAR,0,1); const now=today(); const upto=now<yearStart?yearStart:(now>new Date(YEAR,11,31)?new Date(YEAR,11,31):now); const totalDays=Math.max(1,Math.round((upto-yearStart)/86400000)+1); let done=0; for(let i=0;i<totalDays;i++){ const day=S.habitLog[dkey(addDays(yearStart,i))]||{}; hs.forEach(h=>{ if(day[h.id]) done++; }); } parts.push(Math.min(1, done/(totalDays*hs.length))); } if(gs.length) parts.push(gs.reduce((x,g)=>x+(+g.progress||0),0)/(gs.length*100)); out[a]=Math.min(100, Math.round(100*parts.reduce((x,y)=>x+y,0)/parts.length)); }); return out; }
function ringSVG(pct,size,color){ const r=(size/2)-6, c=2*Math.PI*r, off=c-(pct/100)*c; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color||'var(--gold)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`; }
function donutSVG(){ const counts={}; AREAS.forEach(a=>counts[a]=0); S.goals.forEach(g=>counts[g.area]++); S.habits.forEach(h=>counts[h.area]++); const total=Object.values(counts).reduce((a,b)=>a+b,0); if(!total) return `<p class="mut">Add goals or habits to see your life-area balance.</p>`; const cols=["#0E6B5C","#C9962C","#2E6FA8","#B04A5A","#5C7A3D","#7A5CA8","#C46A28","#4A7A8C"]; let acc=0, paths=""; const cx=70,cy=70,r=58,ir=34; AREAS.forEach((a,i)=>{ const v=counts[a]; if(!v) return; const a0=(acc/total)*2*Math.PI-Math.PI/2; acc+=v; const a1=(acc/total)*2*Math.PI-Math.PI/2; const large=(a1-a0)>Math.PI?1:0; const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+ir*Math.cos(a1),y2=cy+ir*Math.sin(a1),x3=cx+ir*Math.cos(a0),y3=cy+ir*Math.sin(a0); paths+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${ir} ${ir} 0 ${large} 0 ${x3} ${y3} Z" fill="${cols[i]}"><title>${a}: ${v}</title></path>`; }); const legend=AREAS.map((a,i)=>counts[a]?`<span class="chip" style="background:${cols[i]}22">■ ${a} · ${counts[a]}</span>`:"").join(""); return `<div class="row"><svg width="140" height="140" viewBox="0 0 140 140">${paths}</svg><div style="flex:1;min-width:170px">${legend}</div></div>`; }
function applyTheme(){ document.documentElement.dataset.theme = S.settings.theme || "goldenteal"; document.documentElement.classList.toggle("nocolour", !S.settings.colourful); if(S.settings.accent) document.documentElement.style.setProperty("--accent", S.settings.accent); else document.documentElement.style.removeProperty("--accent"); if(S.settings.bgPhoto){ document.body.classList.add("hasbg"); document.body.style.backgroundImage=`linear-gradient(rgba(0,0,0,0.06),rgba(0,0,0,0.06)),url(${S.settings.bgPhoto})`; } else { document.body.classList.remove("hasbg"); document.body.style.backgroundImage=""; } const av=$("#avatar"); if(S.profile.photo){ av.innerHTML=`<img src="${S.profile.photo}" alt="">`; } else { av.textContent = S.profile.name ? S.profile.name.trim().charAt(0).toUpperCase() : "✦"; } $("#whoName").textContent = S.profile.name ? "Hello, "+S.profile.name : "Goal & Habit Tracker 2027"; $("#whoWord").textContent = S.profile.word ? `Word of the year: “${S.profile.word}” · 2027` : "Goal & Habit Tracker · 2027"; $("#honesty").innerHTML = "A planner is a tool, not a promise — your results come from the small steps you take each day. Your data stays on this device; nothing is uploaded anywhere. · The Digital Planner Era"; }

function avatarPicked(input){ const f=input.files&&input.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"); const sc=Math.min(1,300/img.width); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc)); c.getContext("2d").drawImage(img,0,0,c.width,c.height); S.profile.photo=c.toDataURL("image/jpeg",0.85); save(); applyTheme(); render(); toast("📷 Profile photo updated"); }; img.src=r.result; }; r.readAsDataURL(f); input.value=""; }

<script>
const SECTIONS = [
 ["year","📖","My Year","Word of the year + last year's review"],
 ["wheel","🎡","Wheel of Life","Balance across 8 life areas"],
 ["goals","🎯","My Goals","SMART goals by life area"],
 ["steps","👣","Action Steps","Steps & milestones per goal"],
 ["roadmap","🗺️","Quarterly Roadmap","Your 4 quarters at a glance"],
 ["habits","✅","Habit Tracker","Daily ticks, streaks & ladders"],
 ["ideas","💡","Habit Ideas","One-tap starter habits per area"],
 ["daily","🌅","Daily Log","Pick-3, wins, mood — 365 days"],
 ["wellness","💧","Wellness","Sleep + water trackers"],
 ["weekly","🗓️","Weekly Planner","Plan each of the 52 weeks"],
 ["weeklyreview","🔄","Weekly Review","Wins, lessons, next focus"],
 ["monthly","🌙","Monthly Goals","A fresh page every month"],
 ["monthlyreview","📝","Monthly Review","Look back, then forward"],
 ["quarterlyreview","🏁","Quarterly Review","Auto-filled from your data"],
 ["midyear","🌗","Mid-Year Reset","Re-align in July"],
 ["vision","🖼️","Vision Board","Pictures of your 2027"],
 ["challenges","🔥","Challenges","30-day & 100-day challenges"],
 ["wins","🏆","Wins Log","Every win, big or small"],
 ["badges","🎖️","Badges & Rewards","Habit Ladder levels & badges"],
 ["focus","⏱️","Focus Timer","Pomodoro 25/5/15 + Focus Mode"],
 ["sprints","🏃","Focus Sprints","Sprint on a goal — minutes auto-log"],
 ["savings","🐷","Savings Tracker","Watch the fund grow"],
 ["reading","📚","Reading Tracker","Books, pages & progress"],
 ["bucket","🪣","Bucket List","2027's must-do moments"],
 ["pixels","🎨","Year in Pixels","Your mood, day by day"],
 ["gratitude","🙏","Gratitude Log","One good thing a day"],
 ["notes","🗒️","Notes","Lined, dotted & grid pages"],
 ["letter","✉️","Letter to Future Self","Open it on Dec 31, 2027"],
 ["calendar","📅","Calendar","Month view + .ics export"],
 ["settings","⚙️","Settings","Themes, backup, print & more"]];
function sectionProgress(id){ const t=tkey(); switch(id){
 case "goals": return S.goals.length? Math.round(S.goals.reduce((a,g)=>a+(+g.progress||0),0)/S.goals.length) : 0;
 case "habits": return S.habits.length? Math.round(100*dayDone(t)/S.habits.length) : 0;
 case "daily": return S.daily[t] ? 100 : 0;
 case "savings": { const sum=S.savings.entries.reduce((a,e)=>a+(+e.amount||0),0); return S.savings.target? Math.min(100,Math.round(100*sum/S.savings.target)) : 0; }
 case "wins": return Math.min(100, S.wins.length*5);
 case "gratitude": return Math.min(100, S.gratitude.length*4);
 case "reading": return S.books.length? Math.round(100*S.books.filter(b=>b.status==="Finished").length/S.books.length) : 0;
 case "bucket": return S.bucket.length? Math.round(100*S.bucket.filter(b=>b.done).length/S.bucket.length) : 0;
 case "challenges": return S.challenges.length? Math.round(100*S.challenges.reduce((a,c)=>a+Object.keys(c.ticks||{}).length/Math.min(c.days,30),0)/S.challenges.length) : 0;
 case "focus": return Math.min(100, Math.round(S.focusLog.reduce((a,f)=>a+(+f.minutes||0),0)/60));
 case "pixels": return Math.round(100*Object.keys(S.daily).filter(k=>S.daily[k].mood).length/365);
 case "notes": return Math.min(100, S.notes.length*10);
 case "vision": return Math.min(100, S.vision.length*12);
 default: return 0; } }
function renderHome(){ const t=tkey(); const now=today(); const jan1=new Date(YEAR,0,1), dec31=new Date(YEAR,11,31);
 const daysToStart = Math.ceil((jan1-now)/86400000); const daysLeft = Math.ceil((dec31-now)/86400000)+1; const dayOfYear = now<jan1?0:Math.min(365,Math.floor((now-jan1)/86400000)+1);
 const countTxt = now<jan1 ? `⏳ ${daysToStart} days until 2027 begins` : (now>dec31 ? "2027 complete — what a year!" : `📅 Day ${dayOfYear} of 365 · ${daysLeft} days left in 2027`);
 const score = liveScore(); const areas = areaScores();
 const quote = QUOTES[(Math.floor(now.getTime()/86400000))%QUOTES.length];
 const habitRows = S.habits.map(h=>{ const on=(S.habitLog[t]||{})[h.id]; return `<div class="item row spread"><span>${h.icon||"✅"} <b>${esc(h.name)}</b> <span class="mut small">${esc(h.area)} · 🔥 ${habitStreak(h.id)}</span></span><button class="tick ${on?"on":""}" onclick="toggleHabit('${h.id}','${t}')">${on?"✓":""}</button></div>`; });
 const todaysHabits = habitRows.slice(0,5).join("") + (habitRows.length>5 ? `<button class="btn ghost small" onclick="go('habits')">+ ${habitRows.length-5} more habits → Habit Tracker</button>` : "");
 const yk=dkey(addDays(now,-1)); const missedYesterday = S.habits.filter(h=>!(S.habitLog[yk]||{})[h.id] && habitStreak(h.id)>=2);
 let attention = "";
 if(missedYesterday.length && !DEMO){ const wk = dkey(addDays(now,-now.getDay())); const canRescue = !(S.rescue.week===wk && S.rescue.used); attention = `<div class="card" style="border-color:var(--gold);margin-top:14px"><b>⚠️ Attention — streak at risk</b><p class="mut" style="margin:6px 0">${missedYesterday.map(h=>esc(h.name)).join(", ")} missed yesterday. ${canRescue? "Your weekly Streak Rescue can save the streak:" : "This week's Rescue is used — one honest restart beats a broken chain."}</p>${missedYesterday.map(h=>S.ifthen[h.id]?`<p class="small">💡 Your plan for ${esc(h.name)}: <i>${esc(S.ifthen[h.id])}</i></p>`:"").join("")}${canRescue?`<button class="btn gold small" onclick="useRescue('${missedYesterday[0].id}')">🛟 Use Streak Rescue (1 per week)</button>`:""}</div>`; }
 if(S.lastBackup && (Date.now()-S.lastBackup) > 30*86400000) attention += `<div class="card" style="margin-top:10px"><b>💾 Backup reminder</b><p class="mut" style="margin:6px 0">It has been over 30 days since your last backup export.</p><button class="btn ghost small" onclick="go('settings')">Export a backup</button></div>`;
 const nextUp = S.goals.filter(g=>g.deadline).sort((a,b)=>a.deadline<b.deadline?-1:1).filter(g=>(+g.progress||0)<100).slice(0,3).map(g=>`<div class="item row spread"><span>🎯 <b>${esc(g.title)}</b></span><span class="chip">by ${fmtDate(g.deadline)}</span></div>`).join("") || `<p class="mut">No goal deadlines yet — add one in My Goals.</p>`;
 const areaRings = AREAS.filter(a=>areas[a]!=null).map(a=>`<div style="text-align:center;width:76px"><div class="ringwrap">${ringSVG(areas[a],64)}<div class="rv" style="font-size:14px">${areas[a]}</div></div><div class="small mut">${AREA_ICONS[a]} ${a}</div></div>`).join("");
 const cards = SECTIONS.map(([id,ic,tt,ds])=>{ const p=sectionProgress(id); return `<button class="tile" onclick="go('${id}')"><div class="ic">${ic}</div><div class="tt">${tt}</div><div class="ds">${ds}</div><div class="bar"><i style="width:${p}%"></i></div><div class="small mut" style="margin-top:4px">${p}%</div></button>`; }).join("");
 $("#view").innerHTML = `
 <div class="hero"><h1>${S.profile.word? `Make 2027 the year of “${esc(S.profile.word)}”` : "Your 2027, beautifully on track"}</h1><div class="sub">${esc(quote)}</div><span class="count">${countTxt}</span> <button class="iconbtn no-print" style="background:rgba(255,255,255,.22);border:none;color:#fff;vertical-align:middle" onclick="showInfo()" title="About this planner — how it works">📝</button></div>
 <div class="grid g2" style="margin-top:14px">
   <div class="card" style="text-align:center"><div class="mut" style="font-weight:700">⭐ LIVE 2027 SCORE</div><div class="ringwrap" style="margin:8px 0">${ringSVG(score,150)}<div class="rv"><span style="font-size:38px">${score}</span><span class="small mut">of 100</span></div></div><div class="small mut">Habits · Goals · Focus — updates with every tick</div></div>
   <div class="card"><div class="mut" style="font-weight:700;margin-bottom:8px">🎡 LIFE-AREA RINGS</div><div class="row" style="justify-content:space-around">${areaRings || '<p class="mut">Add a habit or goal to light up your first ring.</p>'}</div><div style="margin-top:10px">${donutSVG()}</div></div>
 </div>
 ${attention}
 <div class="card" style="margin-top:14px"><div class="row spread"><b>🌅 Today — ${fmtDate(t)}</b><button class="btn ghost small" onclick="go('daily')">Open Daily Log →</button></div>
   <div style="margin-top:8px">${todaysHabits || '<p class="mut">No habits yet — pick a starter from Habit Ideas 💡</p>'}</div>
   ${(S.daily[t]&&S.daily[t].pick3&&S.daily[t].pick3.length)?`<div class="small" style="margin-top:6px">🎯 Pick-3: ${S.daily[t].pick3.map(esc).join(" · ")}</div>`:""}
 </div>
 <div class="card no-print" style="margin-top:14px"><b>⚡ Quick Add</b><div class="row" style="margin-top:10px"><button class="btn small" onclick="quickAdd('goal')">🎯 Goal</button><button class="btn small" onclick="quickAdd('habit')">✅ Habit</button><button class="btn small" onclick="quickAdd('win')">🏆 Win</button><button class="btn small" onclick="quickAdd('gratitude')">🙏 Gratitude</button><button class="btn small" onclick="quickAdd('note')">🗒️ Note</button><button class="btn ghost small" onclick="printHome()">🖨️ Print Home</button></div>
   <div class="searchbar" style="margin-top:12px"><input id="homeSearch" placeholder="Search goals, habits, notes, wins…" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn gold" onclick="doSearch()">Search</button></div><div id="searchOut" style="margin-top:8px"></div>
 </div>
 <div class="card" style="margin-top:14px"><b>⏭️ Next up — nearest goal deadlines</b><div style="margin-top:8px">${nextUp}</div></div>
 <h3 style="margin:20px 0 10px">All 30 sections</h3>
 <div class="grid g3">${cards}</div>`; }
function toggleHabit(hid, dateK){ S.habitLog[dateK] = S.habitLog[dateK]||{}; const was = !!S.habitLog[dateK][hid]; const before = ladderOf(hid).name; if(was) delete S.habitLog[dateK][hid]; else S.habitLog[dateK][hid]=true; save(); const after = ladderOf(hid).name; if(!was && dateK===tkey()){ const st=habitStreak(hid); if(before!==after){ confetti(); toast(`🎉 Level up! ${after} on the Habit Ladder!`); } else if(st>0 && st%7===0){ confetti(); toast(`🔥 ${st}-day streak — a full week!`); } } render(); }
function useRescue(hid){ const now=today(); const wk=dkey(addDays(now,-now.getDay())); const yk=dkey(addDays(now,-1)); S.habitLog[yk]=S.habitLog[yk]||{}; S.habitLog[yk][hid]=true; S.rescue={week:wk,used:true}; save(); confetti(); toast("🛟 Streak rescued — yesterday is ticked. Keep going!"); render(); }
function quickAdd(kind){ if(kind==="goal") return goalForm(); if(kind==="habit") return habitForm(); if(kind==="win") return entryForm("win"); if(kind==="gratitude") return entryForm("gratitude"); if(kind==="note") return noteForm(); }
function doSearch(){ const q=($("#homeSearch").value||"").toLowerCase().trim(); const out=$("#searchOut"); if(!q){ out.innerHTML=""; return; } const hits=[]; S.goals.forEach(g=>{ if((g.title+" "+g.why+" "+g.area).toLowerCase().includes(q)) hits.push(`🎯 <b>${esc(g.title)}</b> — goal <button class="btn ghost small" onclick="go('goals')">Open</button>`); }); S.habits.forEach(h=>{ if(h.name.toLowerCase().includes(q)) hits.push(`✅ <b>${esc(h.name)}</b> — habit <button class="btn ghost small" onclick="go('habits')">Open</button>`); }); S.notes.forEach(n=>{ if((n.title+" "+n.text).toLowerCase().includes(q)) hits.push(`🗒️ <b>${esc(n.title)}</b> — note <button class="btn ghost small" onclick="go('notes')">Open</button>`); }); S.wins.forEach(w=>{ if(w.text.toLowerCase().includes(q)) hits.push(`🏆 ${esc(w.text)} — win <button class="btn ghost small" onclick="go('wins')">Open</button>`); }); S.books.forEach(b=>{ if((b.title+" "+b.author).toLowerCase().includes(q)) hits.push(`📚 <b>${esc(b.title)}</b> — book <button class="btn ghost small" onclick="go('reading')">Open</button>`); }); out.innerHTML = hits.length? hits.map(h=>`<div class="item">${h}</div>`).join("") : `<p class="mut">No matches for “${esc(q)}”.</p>`; }
function printHome(){ printCurrent(); }
</script>
<script>
function goalForm(id){ const g = id? S.goals.find(x=>x.id===id) : {title:"",area:"Health",why:"",measure:"",deadline:"",top3:false,progress:0,steps:[],focusMin:0};
 openModal(`<h3>${id?"Edit goal":"New goal"} 🎯</h3>
 <label>Goal title</label><input id="gf_t" value="${esc(g.title)}" placeholder="e.g. Run a 10K race">
 <label>Life area</label><select id="gf_a">${AREAS.map(a=>`<option ${a===g.area?"selected":""}>${a}</option>`).join("")}</select>
 <label>Why it matters</label><input id="gf_w" value="${esc(g.why)}">
 <label>How will you measure it? (SMART)</label><input id="gf_m" value="${esc(g.measure)}" placeholder="e.g. Finish under 60 minutes">
 <label>Deadline</label><input id="gf_d" type="date" min="2027-01-01" max="2027-12-31" value="${esc(g.deadline)}">
 <label>Progress %</label><input id="gf_p" type="number" min="0" max="100" value="${g.progress||0}">
 <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="gf_top" style="width:auto" ${g.top3?"checked":""}> ⭐ Top-3 goal of the year</label>
 <div class="row" style="margin-top:16px"><button class="btn gold" id="gf_save">Save goal</button><button class="btn ghost" onclick="closeModal()">Cancel</button>${id?`<button class="btn danger" id="gf_del">Delete</button>`:""}</div>`);
 $("#gf_save").onclick=()=>{ const t=$("#gf_t").value.trim(); if(!t) return toast("Give the goal a title first."); const data={title:t,area:$("#gf_a").value,why:$("#gf_w").value.trim(),measure:$("#gf_m").value.trim(),deadline:$("#gf_d").value,progress:Math.max(0,Math.min(100,+$("#gf_p").value||0)),top3:$("#gf_top").checked}; if(id){ Object.assign(S.goals.find(x=>x.id===id), data); } else { S.goals.push(Object.assign({id:uid(),steps:[],focusMin:0}, data)); } save(); closeModal(); confetti(); toast("🎯 Goal saved!"); render(); };
 if(id) $("#gf_del").onclick=()=>confirmDo("Delete this goal and its action steps?", ()=>{ S.goals=S.goals.filter(x=>x.id!==id); save(); render(); }); }
function renderGoals(){ const filter = renderGoals._f || "All"; const list = S.goals.filter(g=>filter==="All"||g.area===filter); const top3 = S.goals.filter(g=>g.top3);
 $("#view").innerHTML = secHead("🎯 My Goals","SMART goals, grouped by life area") + `
 <div class="row no-print" style="margin-bottom:12px"><button class="btn gold" onclick="goalForm()">+ New goal</button>${["All"].concat(AREAS).map(a=>`<button class="btn ${filter===a?"":"ghost"} small" onclick="renderGoals._f='${a}';render()">${a}</button>`).join("")}</div>
 ${top3.length?`<div class="card" style="margin-bottom:12px"><b>⭐ Top-3 of 2027</b>${top3.map(g=>`<div class="item row spread"><span>${AREA_ICONS[g.area]} <b>${esc(g.title)}</b></span><span class="chip gold">${g.progress||0}%</span></div>`).join("")}</div>`:""}
 ${list.length? list.map(g=>`<div class="item"><div class="row spread"><span class="t">${g.top3?"⭐ ":""}${esc(g.title)}</span><span class="chip">${AREA_ICONS[g.area]} ${esc(g.area)}</span></div>
 ${g.why?`<div class="mut">Why: ${esc(g.why)}</div>`:""}${g.measure?`<div class="mut">Measure: ${esc(g.measure)}</div>`:""}
 <div class="row small mut"><span>${g.steps?g.steps.filter(s=>s.done).length:0}/${g.steps?g.steps.length:0} steps done</span>${g.deadline?`<span>· deadline ${fmtDate(g.deadline)}</span>`:""}${g.focusMin?`<span>· ⏱️ ${g.focusMin} focus minutes</span>`:""}</div>
 <div class="bar"><i style="width:${g.progress||0}%"></i></div>
 <div class="row" style="margin-top:8px"><input type="range" min="0" max="100" value="${g.progress||0}" style="flex:1" onchange="setGoalProgress('${g.id}',this.value)"><b>${g.progress||0}%</b><button class="btn ghost small" onclick="goalForm('${g.id}')">Edit</button><button class="btn small" onclick="go('steps')">Steps →</button></div></div>`).join("") : `<div class="card"><b>No goals here yet.</b><p class="mut">A goal written down is a plan. Add your first one — you can refine it any time.</p></div>`}
 <div class="card no-print"><b>Print</b><p class="mut">Print this section or the whole planner from Settings.</p><button class="btn ghost small" onclick="printCurrent()">🖨️ Print My Goals</button></div>`; }
function setGoalProgress(id,v){ const g=S.goals.find(x=>x.id===id); if(!g) return; g.progress=+v; save(); if(+v===100){ confetti(); toast("🏆 Goal complete — amazing work!"); } render(); }
function renderSteps(){ $("#view").innerHTML = secHead("👣 Action Steps & Milestones","Break every goal into small, tickable steps") +
 (S.goals.length? S.goals.map(g=>`<div class="card" style="margin-bottom:12px"><div class="row spread"><b>${AREA_ICONS[g.area]} ${esc(g.title)}</b><span class="chip">${g.steps.filter(s=>s.done).length}/${g.steps.length} steps</span></div>
 ${(g.steps||[]).map(s=>`<div class="item row spread"><span style="${s.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(s.text)}</span><span class="row"><button class="tick ${s.done?"on":""}" onclick="toggleStep('${g.id}','${s.id}')">${s.done?"✓":""}</button><button class="btn ghost small" onclick="delStep('${g.id}','${s.id}')">✕</button></span></div>`).join("") || '<p class="mut small">No steps yet — add the very first small step.</p>'}
 <div class="row no-print" style="margin-top:8px"><input id="ns_${g.id}" placeholder="Add a step… e.g. Book the race" onkeydown="if(event.key==='Enter')addStep('${g.id}')"><button class="btn small" onclick="addStep('${g.id}')">Add</button><button class="btn gold small" onclick="startSprint('${g.id}')">⏱️ Focus Sprint</button></div></div>`).join("") : `<div class="card"><b>No goals yet.</b><p class="mut">Steps belong to goals — create a goal first.</p><button class="btn gold" onclick="go('goals')">Go to My Goals</button></div>`); }
function addStep(gid){ const inp=$("#ns_"+gid); const v=inp.value.trim(); if(!v) return; const g=S.goals.find(x=>x.id===gid); g.steps.push({id:uid(),text:v,done:false}); save(); render(); }
function toggleStep(gid,sid){ const g=S.goals.find(x=>x.id===gid); const s=g.steps.find(x=>x.id===sid); s.done=!s.done; const done=g.steps.filter(x=>x.done).length; if(g.steps.length) g.progress=Math.round(100*done/g.steps.length); save(); if(s.done) toast("✔ Step done — progress updated!"); render(); }
function delStep(gid,sid){ const g=S.goals.find(x=>x.id===gid); g.steps=g.steps.filter(x=>x.id!==sid); save(); render(); }
function habitForm(id){ const h = id? S.habits.find(x=>x.id===id) : {name:"",area:"Health",icon:"✅"};
 openModal(`<h3>${id?"Edit habit":"New habit"} ✅</h3>
 <label>Habit name</label><input id="hf_n" value="${esc(h.name)}" placeholder="e.g. Morning walk">
 <label>Icon</label><input id="hf_i" value="${esc(h.icon||"✅")}" maxlength="4">
 <label>Life area</label><select id="hf_a">${AREAS.map(a=>`<option ${a===h.area?"selected":""}>${a}</option>`).join("")}</select>
 <label>🛟 If–Then rescue plan</label><input id="hf_it" value="${esc(S.ifthen[id]||"")}" placeholder="If I miss my usual time, then I will do 5 minutes before bed.">
 <div class="row" style="margin-top:16px"><button class="btn gold" id="hf_save">Save habit</button><button class="btn ghost" onclick="closeModal()">Cancel</button>${id?`<button class="btn danger" id="hf_del">Delete</button>`:""}</div>`);
 $("#hf_save").onclick=()=>{ const n=$("#hf_n").value.trim(); if(!n) return toast("Name the habit first."); let hid=id; if(id){ Object.assign(S.habits.find(x=>x.id===id),{name:n,area:$("#hf_a").value,icon:$("#hf_i").value||"✅"}); } else { hid=uid(); S.habits.push({id:hid,name:n,area:$("#hf_a").value,icon:$("#hf_i").value||"✅"}); } S.ifthen[hid]=$("#hf_it").value.trim(); save(); closeModal(); toast("✅ Habit saved!"); render(); };
 if(id) $("#hf_del").onclick=()=>confirmDo("Delete this habit? Its past ticks stay in your history counts but the habit leaves the tracker.", ()=>{ S.habits=S.habits.filter(x=>x.id!==id); save(); render(); }); }
let habitView = {y: YEAR, m: null};
function renderHabits(){ const now=today(); if(habitView.m===null) habitView.m = now.getFullYear()===YEAR? now.getMonth() : 0; const y=habitView.y, m=habitView.m; const dim=daysInMonth(y,m);
 const firstOffset=(new Date(y,m,1).getDay()+6)%7;
 const cards = S.habits.map(h=>{ const lad=ladderOf(h.id); const streak=habitStreak(h.id); let monthTicks=0; for(let d=1;d<=dim;d++){ if((S.habitLog[`${y}-${pad2(m+1)}-${pad2(d)}`]||{})[h.id]) monthTicks++; }
  let cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(dw=>`<div class="dow">${dw}</div>`).join("");
  for(let i=0;i<firstOffset;i++) cells+=`<div></div>`;

 $("#view").innerHTML = secHead("✅ Habit Tracker",`One chart per habit · tap a day to tick it`) + `

let dailyDate = null;

 $("#view").innerHTML = secHead("🌅 Daily Log","One page per day — all 365 days of 2027") + `
 <div class="row no-print" style="margin-bottom:12px"><button class="btn ghost small" onclick="dailyDate='${prev}';render()">← Prev day</button><b>${fmtDate(k)}${k===tkey()?" · Today":""}</b><button class="btn ghost small" onclick="dailyDate='${next}';render()">Next day →</button><button class="btn ghost small" onclick="dailyDate=tkey();render()">Today</button></div>
 <div class="grid g2">

 <label>🏆 Today's win</label><input value="${esc(d.wins||"")}" oninput="setDaily('${k}','wins',null,this.value)" placeholder="One thing that went well">

 <label>🙏 One gratitude</label><input id="dg_${k}" placeholder="One good thing about today"><div class="row" style="margin-top:8px"><button class="btn small" onclick="addDailyGrat('${k}')">Add to Gratitude Log</button><button class="btn ghost small" onclick="go('gratitude')">Open the Gratitude Log →</button></div></div>
 </div>

function setDaily(k, field, idx, val){ S.daily[k]=S.daily[k]||{pick3:[],wins:"",mood:0,sleep:"",water:0,note:""}; if(field==="pick3"){ S.daily[k].pick3=S.daily[k].pick3||[]; S.daily[k].pick3[idx]=val; } else if(field==="mood"||field==="water"){ S.daily[k][field]=+val; } else { S.daily[k][field]=val; } save(); if(field==="mood"||field==="water") render(); else if(field==="sleep" && S.lastSection==="wellness") render(); }

function renderWellness(){ const days=[]; for(let i=6;i>=0;i--){ const k=dkey(addDays(today(),-i)); days.push({k, d:S.daily[k]||{}}); }

 const avgS = (days.reduce((a,x)=>a+(+x.d.sleep||0),0)/days.filter(x=>+x.d.sleep>0).length||0);
 $("#view").innerHTML = secHead("💧 Wellness","Sleep and water — the fuel behind every goal") + `
 <div class="grid g2"><div class="card"><b>😴 Sleep — last 7 days</b>${chart("sleep",10,"var(--accent)","h")}<p class="mut small">Average: ${avgS?avgS.toFixed(1):"—"} hours. Log sleep in the Daily Log.</p></div>
 <div class="card"><b>💧 Water — last 7 days</b>${chart("water",8,"var(--gold)","")}<p class="mut small">Goal: 8 glasses a day. Tap the drops in the Daily Log.</p></div></div>
 <div class="card" style="margin-top:12px"><b>Quick log for today</b><div class="row" style="margin-top:8px"><span>Sleep last night:</span><input type="number" step="0.5" min="0" max="24" style="width:110px" id="wSleep" value="${(S.daily[tkey()]||{}).sleep||""}"><button class="btn small" onclick="setDaily(tkey(),'sleep',null,$('#wSleep').value);toast('😴 Sleep logged — chart updated')">Save</button><span style="margin-left:10px">Water:</span>${Array.from({length:8},(_,i)=>`<button class="tick ${((S.daily[tkey()]||{}).water||0)>i?"on":""}" onclick="setDaily(tkey(),'water',null,${i+1})">💧</button>`).join("")}</div></div>
 <div class="card" style="margin-top:12px"><div class="row spread"><b>➕ Your own metrics</b><button class="btn gold small" onclick="metricForm()">+ Add your own metric</button></div>
 ${(S.customMetrics||[]).map(mt=>{ const tval=(S.metricLog[tkey()]||{})[mt.id]; const last7=days.map(({k})=>{ const v=(S.metricLog[k]||{})[mt.id]; return v!=null&&v!==""? +v : null; }); const mx=Math.max(1,...last7.filter(v=>v!=null)); return `<div style="margin-top:12px"><div class="row spread"><b>${esc(mt.name)}</b><span class="row"><input type="number" step="any" style="width:110px" id="mt_${mt.id}" value="${tval!=null?tval:""}" placeholder="Today"><span class="mut small">${esc(mt.unit||"")}</span><button class="btn small" onclick="setMetric('${mt.id}')">Save</button><button class="btn ghost small" onclick="delMetric('${mt.id}')">✕</button></span></div><div class="row" style="align-items:flex-end;gap:10px;height:74px;margin-top:6px">${days.map(({k},i)=>`<div style="flex:1;text-align:center">${last7[i]!=null?`<div style="background:var(--accent);height:${Math.round(52*last7[i]/mx)}px;border-radius:6px 6px 0 0"></div><div class="small" style="margin-top:3px">${last7[i]}</div>`:`<div class="small mut" style="padding-top:34px">—</div>`}<div class="small mut">${parseK(k).toLocaleDateString("en-US",{weekday:"narrow"})}</div></div>`).join("")}</div></div>`; }).join("") || '<p class="mut small" style="margin-top:8px">Track anything else daily — steps, weight, exercise minutes, pages, push-ups… Give it a name and a unit, log a number each day, and its chart appears here.</p>'}</div>`; }
function metricForm(){ openModal(`<h3>New wellness metric ➕</h3><label>Name</label><input id="mf_n" placeholder="e.g. Steps, Weight, Exercise"><label>Unit (optional)</label><input id="mf_u" placeholder="e.g. steps, kg, minutes"><div class="row" style="margin-top:16px"><button class="btn gold" id="mf_save">Add metric</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
 $("#mf_save").onclick=()=>{ const n=$("#mf_n").value.trim(); if(!n) return toast("Name the metric first."); S.customMetrics=S.customMetrics||[]; S.customMetrics.push({id:uid(),name:n,unit:$("#mf_u").value.trim()}); save(); closeModal(); toast("➕ Metric added — log today's number below."); render(); }; }

let weekStart = null;

function renderWeekly(){ if(!weekStart) weekStart = dkey(mondayOf(today())); const start=parseK(weekStart); const plan=S.weeklyPlan[weekStart]||{focus:"",days:{}};
 let dayCards=""; for(let i=0;i<7;i++){ const k=dkey(addDays(start,i)); dayCards+=`<div class="card"><b>${parseK(k).toLocaleDateString("en-US",{weekday:"long"})}</b><div class="small mut">${fmtDate(k)}${k===tkey()?" · Today":""}</div><textarea style="margin-top:8px" placeholder="Plan for this day…" oninput="setWeekDay('${weekStart}','${k}',this.value)">${esc((plan.days||{})[k]||"")}</textarea><div class="small mut" style="margin-top:6px">✅ ${dayDone(k)}/${S.habits.length} habits · 😊 ${(S.daily[k]||{}).mood?["","😖","😕","😐","🙂","😄"][S.daily[k].mood]:"—"}</div></div>`; }

 <div class="card" style="margin-bottom:12px"><label style="margin-top:0">🎯 This week's #1 focus</label><input value="${esc(plan.focus||"")}" oninput="setWeekFocus('${weekStart}',this.value)" placeholder="If only one thing happens this week, it is…"></div>
 <div class="grid g2">${dayCards}</div>

function setWeekDay(ws,k,v){ S.weeklyPlan[ws]=S.weeklyPlan[ws]||{focus:"",days:{}}; S.weeklyPlan[ws].days=S.weeklyPlan[ws].days||{}; S.weeklyPlan[ws].days[k]=v; save(); }

 $("#view").innerHTML = secHead("🔄 Weekly Review & Reset","Ten honest minutes that make next week better") + `
 <div class="row no-print" style="margin-bottom:12px"><button class="btn ghost small" onclick="weekStart=dkey(addDays(parseK(weekStart),-7));render()">← Prev week</button><b>Week of ${fmtDate(ws)}</b><button class="btn ghost small" onclick="weekStart=dkey(addDays(parseK(weekStart),7));render()">Next week →</button></div>
 <div class="card" style="margin-bottom:12px"><b>📊 Your week in numbers (auto-filled)</b><div class="row" style="margin-top:8px"><span class="chip">✅ ${ticks}/${possible} habit ticks</span><span class="chip">⏱️ ${S.focusLog.filter(f=>{ const dk=f.date; return dk>=ws && dk<=dkey(addDays(parseK(ws),6)); }).reduce((a,f)=>a+(+f.minutes||0),0)} focus minutes</span><span class="chip">🏆 ${S.wins.filter(w=>w.date>=ws&&w.date<=dkey(addDays(parseK(ws),6))).length} wins logged</span></div></div>

<script>

 <div class="row no-print" style="margin-bottom:12px">${MONTHS.map((mn,i)=>`<button class="btn ${i===m?"":"ghost"} small" onclick="monthSel=${i};render()">${mn.slice(0,3)}</button>`).join("")}</div>

function renderMonthlyReview(){ if(monthSel===null) monthSel=curMonthIdx(); const m=monthSel; const r=S.monthlyReview[m]||{best:"",hard:"",lesson:"",next:""}; let ticks=0; const dim=daysInMonth(YEAR,m); for(let d=1;d<=dim;d++) ticks+=dayDone(`${YEAR}-${pad2(m+1)}-${pad2(d)}`);
 $("#view").innerHTML = secHead("📝 Monthly Review",`${MONTHS[m]} 2027`) + `
 <div class="row no-print" style="margin-bottom:12px">${MONTHS.map((mn,i)=>`<button class="btn ${i===m?"":"ghost"} small" onclick="monthSel=${i};render()">${mn.slice(0,3)}</button>`).join("")}</div>
 <div class="card" style="margin-bottom:12px"><b>📊 ${MONTHS[m]} in numbers (auto-filled)</b><div class="row" style="margin-top:8px"><span class="chip">✅ ${ticks} habit ticks</span><span class="chip">🌅 ${Object.keys(S.daily).filter(k=>k.startsWith(`${YEAR}-${pad2(m+1)}`)).length} daily logs</span><span class="chip">🏆 ${S.wins.filter(w=>w.date.startsWith(`${YEAR}-${pad2(m+1)}`)).length} wins</span></div></div>

 <label>📚 Lesson</label><textarea oninput="setMR(${m},'lesson',this.value)">${esc(r.lesson||"")}</textarea>
 <label>🎯 Next month, I will…</label><textarea oninput="setMR(${m},'next',this.value)">${esc(r.next||"")}</textarea></div>
 <div class="card no-print" style="margin-top:12px"><div class="row"><button class="btn ghost small" onclick="go('monthly')">← Monthly Goals</button><button class="btn ghost small" onclick="habitView.m=${m};go('habits')">${MONTHS[m]} Habit Tracker →</button></div></div>`; }
function setMR(m,f,v){ S.monthlyReview[m]=S.monthlyReview[m]||{best:"",hard:"",lesson:"",next:""}; S.monthlyReview[m][f]=v; save(); }

function renderRoadmap(){ const qs=[0,1,2,3].map(q=>{ const plan=S.quarterlyPlan[q]||{focus:"",notes:""}; const goals=S.goals.filter(g=>g.deadline && qOfMonth(parseK(g.deadline).getMonth())===q);
 return `<div class="card"><b>Q${q+1} · ${MONTHS[q*3]} – ${MONTHS[q*3+2]}</b><label>Focus</label><input value="${esc(plan.focus||"")}" oninput="setQP(${q},'focus',this.value)" placeholder="Quarter theme">

 <label>Notes</label><textarea oninput="setQP(${q},'notes',this.value)">${esc(plan.notes||"")}</textarea></div>`; }).join("");

function renderQuarterlyReview(){ const now=today(); const cq = now.getFullYear()===YEAR? qOfMonth(now.getMonth()) : 0; const q = renderQuarterlyReview._q!=null? renderQuarterlyReview._q : cq; const startM=q*3; let ticks=0; for(let m=startM;m<startM+3;m++){ const dim=daysInMonth(YEAR,m); for(let d=1;d<=dim;d++) ticks+=dayDone(`${YEAR}-${pad2(m+1)}-${pad2(d)}`); }
 const r=S.quarterlyReview[q]||{reflection:"",carried:false}; const unfinished=S.goals.filter(g=>(+g.progress||0)<100);
 $("#view").innerHTML = secHead("🏁 Quarterly Review","Pre-written from your real data — just add your reflection") + `
 <div class="row no-print" style="margin-bottom:12px">${[0,1,2,3].map(i=>`<button class="btn ${i===q?"":"ghost"} small" onclick="renderQuarterlyReview._q=${i};render()">Q${i+1}</button>`).join("")}</div>

 <p class="mut" style="margin-top:8px">Top habit: ${S.habits.length? esc(S.habits.slice().sort((a,b)=>habitTotal(b.id)-habitTotal(a.id))[0].name) : "—"} · Best streak: ${S.habits.length? Math.max.apply(null,S.habits.map(h=>habitStreak(h.id))) : 0} days</p></div>
 <div class="card"><label style="margin-top:0">🪞 Your reflection on Q${q+1}</label><textarea style="min-height:110px" oninput="setQR(${q},this.value)" placeholder="What did this quarter teach you?">${esc(r.reflection||"")}</textarea>

 openModal(`<h3>${id?"Edit book":"Add a book"} 📚</h3><label>Title</label><input id="bf_t" value="${esc(b.title)}"><label>Author</label><input id="bf_a" value="${esc(b.author)}"><label>Total pages</label><input id="bf_p" type="number" value="${b.pages||""}"><label>Status</label><select id="bf_s">${["Want to read","Reading","Finished"].map(s=>`<option ${s===b.status?"selected":""}>${s}</option>`).join("")}</select><div class="row" style="margin-top:16px"><button class="btn gold" id="bf_save">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button>${id?`<button class="btn danger" id="bf_del">Delete</button>`:""}</div>`);
 $("#bf_save").onclick=()=>{ const t=$("#bf_t").value.trim(); if(!t) return toast("Add a title."); const data={title:t,author:$("#bf_a").value.trim(),pages:+$("#bf_p").value||0,status:$("#bf_s").value}; if(id) Object.assign(S.books.find(x=>x.id===id),data); else S.books.push(Object.assign({id:uid(),read:0},data)); save(); closeModal(); render(); };
 if(id) $("#bf_del").onclick=()=>confirmDo("Remove this book?", ()=>{ S.books=S.books.filter(x=>x.id!==id); save(); render(); }); }
function setBookRead(id,v){ const b=S.books.find(x=>x.id===id); b.read=+v||0; if(b.pages && b.read>=b.pages){ b.status="Finished"; confetti(); toast("📚 Book finished! Add it to your Wins Log."); } save(); render(); }
function renderBucket(){ $("#view").innerHTML = secHead("🪣 Bucket List","The moments that make 2027 a story worth telling") + `
 <div class="row no-print" style="margin-bottom:12px"><input id="bk_new" placeholder="Add a bucket-list moment…" onkeydown="if(event.key==='Enter')addBucket()"><button class="btn gold" onclick="addBucket()">Add</button></div>
 ${S.bucket.map(b=>`<div class="item row spread"><span style="${b.done?"text-decoration:line-through;color:var(--muted)":""}">🪣 ${esc(b.text)}</span><span class="row"><button class="tick ${b.done?"on":""}" onclick="toggleBucket('${b.id}')">${b.done?"✓":""}</button><button class="btn ghost small" onclick="delBucket('${b.id}')">✕</button></span></div>`).join("") || '<p class="mut">Empty for now — dream a little, then write it down.</p>'}`; }
function addBucket(){ const v=$("#bk_new").value.trim(); if(!v) return; S.bucket.push({id:uid(),text:v,done:false}); save(); render(); }
function toggleBucket(id){ const b=S.bucket.find(x=>x.id===id); b.done=!b.done; save(); if(b.done){ confetti(); toast("🪣 Bucket-list moment DONE!"); } render(); }
function delBucket(id){ S.bucket=S.bucket.filter(x=>x.id!==id); save(); render(); }
function pixelDay(k){ const mood=(S.daily[k]||{}).mood||0; const names=["","😖 Rough","😕 Low","😐 Okay","🙂 Good","😄 Great"]; const faces=["","😖","😕","😐","🙂","😄"];
 openModal(`<h3>📅 ${fmtDate(k)}</h3><div style="text-align:center;font-size:68px;margin:8px 0">${mood?faces[mood]:"⬜"}</div><p class="mut" style="text-align:center">${mood? "That day's mood: <b>"+names[mood]+"</b>" : "No mood logged for this day yet — set it in the Daily Log."}</p><div class="row" style="margin-top:16px;justify-content:center"><button class="btn gold" onclick="closeModal();dailyDate='${k}';go('daily')">Open that day's Daily Log →</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`); }
function renderPixels(){ const moodName=["","😖 Rough","😕 Low","😐 Okay","🙂 Good","😄 Great"]; let rows=""; for(let m=0;m<12;m++){ const dim=daysInMonth(YEAR,m); let cells=""; for(let d=1;d<=31;d++){ if(d>dim){ cells+=`<i style="opacity:0"></i>`; } else { const k=`${YEAR}-${pad2(m+1)}-${pad2(d)}`; const mood=(S.daily[k]||{}).mood||0; cells+=`<i class="${mood?"m"+mood:""}" title="${MONTHS[m]} ${d}${mood?" · "+moodName[mood]:""}" onclick="pixelDay('${k}')" style="cursor:pointer"></i>`; } } rows+=`<div class="row" style="gap:8px;margin-bottom:5px"><span class="small" style="width:74px"><b>${MONTHS[m].slice(0,3)}</b></span><div class="pix" style="flex:1">${cells}</div></div>`; }
 $("#view").innerHTML = secHead("🎨 Year in Pixels","Every day gets a colour — set your mood in the Daily Log (tap a square to open that day)") + `<div class="card">${rows}<div class="row" style="margin-top:10px">${[1,2,3,4,5].map(n=>`<span class="chip"><i style="display:inline-block;width:12px;height:12px;border-radius:3px" class="pix"><i class="m${n}" style="width:12px;height:12px"></i></i> ${moodName[n]}</span>`).join("")}</div><p class="mut small" style="margin-top:8px">${Object.keys(S.daily).filter(k=>S.daily[k].mood).length} days coloured so far.</p></div>`; }
function renderNotes(){ $("#view").innerHTML = secHead("🗒️ Notes","Lined, dotted and grid pages for every kind of thinking") + `
 <div class="row no-print" style="margin-bottom:12px"><button class="btn gold" onclick="noteForm()">+ New note</button></div>
 <div class="grid g2">${S.notes.map(n=>`<div><div class="note-paper note-${n.style||"lined"}"><b>${esc(n.title)}</b><div class="small mut">${fmtDate(n.date||tkey())} · ${esc(n.style||"lined")}</div><div style="margin-top:6px">${esc(n.text)}</div></div><div class="row" style="margin-top:6px"><button class="btn ghost small" onclick="noteForm('${n.id}')">Edit</button><button class="btn ghost small" onclick="delNote('${n.id}')">Delete</button></div></div>`).join("") || '<div class="card"><b>No notes yet.</b></div>'}</div>`; }
function noteForm(id){ const n=id? S.notes.find(x=>x.id===id) : {title:"",style:"lined",text:""};
 openModal(`<h3>${id?"Edit note":"New note"} 🗒️</h3><label>Title</label><input id="nf_t" value="${esc(n.title)}"><label>Paper style</label><select id="nf_s">${["lined","dotted","gridp"].map(s=>`<option value="${s}" ${s===n.style?"selected":""}>${s==="gridp"?"grid":s}</option>`).join("")}</select><label>Note</label><textarea id="nf_x" style="min-height:130px">${esc(n.text)}</textarea><div class="row" style="margin-top:16px"><button class="btn gold" id="nf_save">Save note</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
 $("#nf_save").onclick=()=>{ const data={title:$("#nf_t").value.trim()||"Untitled",style:$("#nf_s").value,text:$("#nf_x").value}; if(id) Object.assign(S.notes.find(x=>x.id===id),data); else S.notes.unshift(Object.assign({id:uid(),date:tkey()},data)); save(); closeModal(); render(); }; }
function delNote(id){ confirmDo("Delete this note?", ()=>{ S.notes=S.notes.filter(x=>x.id!==id); save(); render(); }); }
function renderLetter(){ const open = tkey() >= (S.letter.openOn||"2027-12-31");
 $("#view").innerHTML = secHead("✉️ Letter to Future Self","Write it now, open it at the end of 2027") + `
 <div class="card">${open? "" : `<p class="chip gold">🔒 Sealed until ${fmtDate(S.letter.openOn||"2027-12-31")}</p>`}
 <label>Open on</label><input type="date" value="${esc(S.letter.openOn||"2027-12-31")}" oninput="S.letter.openOn=this.value;save()">
 <label>Your letter</label><textarea style="min-height:200px" oninput="S.letter.text=this.value;save()" placeholder="Dear future me…">${esc(S.letter.text||"")}</textarea>
 <p class="mut small">Be kind and specific — future you will be glad you wrote it.</p></div>`; }
let calY = YEAR, calM = null;
function renderCalendar(){ if(calM===null) calM=curMonthIdx(); const y=calY, m=calM; const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; const dim=daysInMonth(y,m);
 let cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join(""); for(let i=0;i<startDow;i++) cells+=`<div></div>`;
 for(let d=1;d<=dim;d++){ const k=`${y}-${pad2(m+1)}-${pad2(d)}`; const done=dayDone(k); const dl=S.goals.filter(g=>g.deadline===k); const evs=(S.events||[]).filter(e=>e.date===k); const mood=(S.daily[k]||{}).mood||0; cells+=`<div class="cd ${k===tkey()?"today":""}" onclick="calDay('${k}')" title="Tap to add or view events"><div class="n">${d}</div>${done?`<div>✅ ${done}/${S.habits.length}</div>`:""}${dl.map(g=>`<div>🎯 ${esc(g.title.slice(0,14))}</div>`).join("")}${evs.map(e=>`<div>${e.type==="reminder"?"⏰":"📌"} ${esc(e.title.slice(0,14))}</div>`).join("")}${mood?`<div>${["","😖","😕","😐","🙂","😄"][mood]}</div>`:""}</div>`; }
 $("#view").innerHTML = secHead("📅 Calendar","Tap any date to add an event or reminder") + `
 <div class="row no-print" style="margin-bottom:12px"><button class="btn ghost small" onclick="calM=Math.max(0,calM-1);render()">←</button><b>${MONTHS[m]} ${y}</b><button class="btn ghost small" onclick="calM=Math.min(11,calM+1);render()">→</button><button class="btn gold small" onclick="exportICS()">⬇ Export .ics (deadlines + events)</button></div>
 <div class="cal">${cells}</div>`; }
function calDay(k){ const dl=S.goals.filter(g=>g.deadline===k); const evs=(S.events||[]).filter(e=>e.date===k); const done=dayDone(k); const mood=(S.daily[k]||{}).mood||0;
 openModal(`<h3>📅 ${fmtDate(k)}</h3>
 ${done?`<p class="mut">✅ Habits done: ${done}/${S.habits.length}${mood?` · Mood: ${["","😖","😕","😐","🙂","😄"][mood]}`:""}</p>`:""}
 ${dl.map(g=>`<div class="item">🎯 Goal deadline: <b>${esc(g.title)}</b></div>`).join("")}
 ${evs.map(e=>`<div class="item row spread"><span>${e.type==="reminder"?"⏰":"📌"} ${esc(e.title)}</span><button class="btn ghost small" onclick="delEvent('${e.id}','${k}')">Delete</button></div>`).join("")}
 <label style="margin-top:12px">Add to this date</label><input id="ev_t" placeholder="e.g. Dentist at 10am, or Call the bank">
 <label>Type</label><select id="ev_ty"><option value="event">📌 Event</option><option value="reminder">⏰ Reminder</option></select>
 <div class="row" style="margin-top:16px"><button class="btn gold" onclick="addEvent('${k}')">Add</button><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn ghost" onclick="closeModal();dailyDate='${k}';go('daily')">Open Daily Log →</button></div>`); }
function addEvent(k){ const t=$("#ev_t").value.trim(); if(!t) return toast("Write the event first."); S.events=S.events||[]; S.events.push({id:uid(),date:k,title:t,type:$("#ev_ty").value}); save(); toast("📌 Saved on "+fmtDate(k)); calDay(k); render(); }
function delEvent(id,k){ S.events=(S.events||[]).filter(e=>e.id!==id); save(); calDay(k); render(); }
function exportICS(){ const evs=S.goals.filter(g=>g.deadline).map(g=>`BEGIN:VEVENT\nUID:${g.id}@digitalplannerera\nDTSTART;VALUE=DATE:${g.deadline.replace(/-/g,"")}\nSUMMARY:🎯 Goal deadline: ${g.title.replace(/,/g," ")}\nEND:VEVENT`).concat((S.events||[]).map(e=>`BEGIN:VEVENT\nUID:${e.id}@digitalplannerera\nDTSTART;VALUE=DATE:${e.date.replace(/-/g,"")}\nSUMMARY:${e.type==="reminder"?"⏰":"📌"} ${e.title.replace(/,/g," ")}\nEND:VEVENT`)).join("\n"); const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//The Digital Planner Era//Goal Habit Tracker 2027//EN\n${evs}\nEND:VCALENDAR`; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="planner-2027.ics"; a.click(); toast("📅 .ics exported — import it into any calendar app."); }
function renderSprints(){ $("#view").innerHTML = secHead("🏃 Focus Sprints","Start a Pomodoro from a goal — the minutes land on that goal automatically") + `
 <div class="card" style="margin-bottom:12px"><b>How it works</b><p class="mut">Pick a goal below and press Sprint. A 25-minute Focus Timer starts, already linked to that goal. When it finishes, the minutes are added to the goal's focus total — no manual logging, ever.</p></div>
 ${S.goals.length? S.goals.map(g=>{ const sessions=S.focusLog.filter(f=>f.goalId===g.id); return `<div class="item"><div class="row spread"><span class="t">${AREA_ICONS[g.area]} ${esc(g.title)}</span><span class="chip gold">⏱️ ${g.focusMin||0} focus min</span></div><div class="small mut">${sessions.length} sprint session(s) · goal progress ${g.progress||0}%</div><div class="bar"><i style="width:${g.progress||0}%"></i></div><div class="row" style="margin-top:8px"><button class="btn gold small" onclick="startSprint('${g.id}')">🏃 Start 25-min Sprint</button><button class="btn ghost small" onclick="go('steps')">See its steps →</button></div></div>`; }).join("") : `<div class="card"><b>No goals yet.</b><p class="mut">Sprints attach to goals — create one first.</p><button class="btn gold" onclick="go('goals')">Go to My Goals</button></div>`}`; }
function renderSettings(){ const th=THEMES.map(t=>`<button class="themebtn ${S.settings.theme===t.id?"sel":""}" onclick="setTheme('${t.id}')">${t.dark?"🌙":"☀️"} ${t.n}</button>`).join("");
 const accents=["#0E6B5C","#2E6FA8","#B04A5A","#5C7A3D","#C46A28","#7A5CA8","#17352F"].map(c=>`<span class="swatch ${S.settings.accent===c?"sel":""}" style="background:${c}" onclick="setAccent('${c}')"></span>`).join("");
 $("#view").innerHTML = secHead("⚙️ Settings","Make it yours — themes, backup, print") + `
 <div class="grid g2">
 <div class="card"><b>👤 Profile</b><label>Your name</label><input id="st_name" value="${esc(S.profile.name)}"><label>Word of the year</label><input id="st_word" value="${esc(S.profile.word)}"><label>Currency symbol</label><input id="st_cur" value="${esc(S.profile.currency||"$")}" maxlength="3" style="max-width:90px"><label>Profile photo</label><input type="file" id="st_photo" accept="image/*"><div class="row" style="margin-top:12px"><button class="btn gold" onclick="saveProfile()">Save profile</button></div></div>
 <div class="card"><b>🎨 Look</b><label>Theme (10 named themes — 5 light, 5 dark)</label><div class="themerow">${th}</div>
 <label>Custom accent colour</label><div class="themerow">${accents}<input type="color" id="st_accent" value="${S.settings.accent||"#0E6B5C"}" style="width:52px;height:38px;padding:2px" onchange="setAccent(this.value)"><button class="btn ghost small" onclick="setAccent('')">Reset</button></div>
 <label>Background photo</label><input type="file" id="st_bg" accept="image/*"><div class="row" style="margin-top:8px"><button class="btn ghost small" onclick="setBg()">Apply background</button>${S.settings.bgPhoto?'<button class="btn ghost small" onclick="S.settings.bgPhoto=null;save();applyTheme();render()">Remove</button>':""}</div>
 <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" style="width:auto" ${S.settings.colourful?"checked":""} onchange="S.settings.colourful=this.checked;save();applyTheme()"> 🌈 Colourful mode</label></div>
 <div class="card"><b>💾 Backup</b><p class="mut small">Your data lives only in this browser, on this device. Export a backup file regularly${S.lastBackup? ` — last backup: ${new Date(S.lastBackup).toLocaleDateString()}` : ""}.</p><div class="row" style="margin-top:10px"><button class="btn gold" onclick="exportBackup()">⬇ Export backup (JSON)</button><label class="btn ghost" style="margin:0;cursor:pointer">⬆ Import backup<input type="file" id="impFile" accept=".json" style="display:none" onchange="importBackup(this)"></label></div></div>
 <div class="card"><b>🖨️ Print</b><p class="mut small">Print the section you are viewing, or a full-year summary.</p><div class="row" style="margin-top:10px"><button class="btn" onclick="printCurrent()">Print current view</button><button class="btn ghost" onclick="printFull()">Print full summary</button></div>
 <b style="display:block;margin-top:18px">♻️ Data</b><div class="row" style="margin-top:8px"><button class="btn ghost" onclick="restoreSample()">Restore sample data</button><button class="btn danger" onclick="resetAll()">Archive & reset everything</button></div></div>
 </div>
 <div class="card" style="margin-top:12px"><b>About this planner</b><p class="mut small">Goal &amp; Habit Tracker 2027 · 30 sections · 513+ dated screens generated for the real 2027 calendar (leap-aware) · Works fully offline · Your data never leaves your device. · The Digital Planner Era — Every Era of Your Life, Beautifully Planned.</p></div>`; }
function setTheme(id){ S.settings.theme=id; save(); applyTheme(); render(); }
function setAccent(c){ S.settings.accent=c; save(); applyTheme(); render(); }
function setBg(){ const f=$("#st_bg").files[0]; if(!f) return toast("Choose a photo first."); readImage(f, 1400, url=>{ S.settings.bgPhoto=url; save(); applyTheme(); render(); toast("🖼️ Background applied"); }); }
function saveProfile(){ S.profile.name=$("#st_name").value.trim(); S.profile.word=$("#st_word").value.trim(); S.profile.currency=$("#st_cur").value||"$"; const f=$("#st_photo").files[0]; const done=()=>{ save(); applyTheme(); toast("👤 Profile saved"); render(); }; if(f){ readImage(f, 300, url=>{ S.profile.photo=url; done(); }); } else done(); }
function exportBackup(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download="goal-habit-tracker-2027-backup.json"; a.click(); S.lastBackup=Date.now(); save(); toast("💾 Backup downloaded — keep it somewhere safe."); }
function importBackup(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data || typeof data!=="object" || !("profile" in data)) throw 0; S=Object.assign(blankState(), data); save(); applyTheme(); toast("✅ Backup restored!"); go("home"); }catch(e){ toast("That file does not look like a backup from this planner."); } }; r.readAsText(f); }
function restoreSample(){ confirmDo("Replace everything with the sample data? Your current data will be lost (export a backup first if you need it).", ()=>{ S=sampleState(); save(); applyTheme(); toast("Sample data restored."); go("home"); }); }
function resetAll(){ confirmDo("Archive & reset: this wipes ALL data in this planner and starts blank. Export a backup first if you might want it back.", ()=>{ S=blankState(); S.profile.onboarded=true; save(); applyTheme(); toast("Fresh start — all clear."); go("home"); }); }
function printCurrent(){ const pa=$("#printArea"); const clone=$("#view").cloneNode(true); clone.querySelectorAll(".no-print").forEach(el=>el.remove()); pa.innerHTML=`<h1 style="margin-bottom:10px">Goal & Habit Tracker 2027</h1>`+clone.innerHTML; window.print(); }
function printFull(){ const pa=$("#printArea"); const cur=S.profile.currency||"$"; const saved=S.savings.entries.reduce((a,e)=>a+(+e.amount||0),0);
 pa.innerHTML=`<h1>Goal & Habit Tracker 2027 — Full Summary</h1><p>${S.profile.name? esc(S.profile.name)+" · ":""}Word of the year: ${esc(S.profile.word||"—")} · Live 2027 Score: ${liveScore()}/100</p>
 <h2 style="margin-top:16px">🎯 Goals</h2>${S.goals.map(g=>`<p>• ${esc(g.title)} (${esc(g.area)}) — ${g.progress||0}%${g.deadline? " · by "+fmtDate(g.deadline):""}</p>`).join("") || "<p>No goals yet.</p>"}
 <h2 style="margin-top:16px">✅ Habits</h2>${S.habits.map(h=>`<p>• ${esc(h.name)} — ${habitTotal(h.id)} ticks · streak ${habitStreak(h.id)} · ${ladderOf(h.id).name}</p>`).join("") || "<p>No habits yet.</p>"}
 <h2 style="margin-top:16px">🐷 Savings</h2><p>${cur}${saved.toLocaleString()} of ${cur}${(+S.savings.target||0).toLocaleString()}</p>
 <h2 style="margin-top:16px">🏆 Wins</h2>${S.wins.map(w=>`<p>• ${esc(w.text)} (${fmtDate(w.date)})</p>`).join("") || "<p>None yet.</p>"}
 <h2 style="margin-top:16px">🙏 Gratitude</h2>${S.gratitude.map(w=>`<p>• ${esc(w.text)} (${fmtDate(w.date)})</p>`).join("") || "<p>None yet.</p>"}
 <p style="margin-top:20px;font-size:12px">The Digital Planner Era — Every Era of Your Life, Beautifully Planned.</p>`; window.print(); }
const RENDER = {home:renderHome, year:renderYear, wheel:renderWheel, goals:renderGoals, steps:renderSteps, roadmap:renderRoadmap, habits:renderHabits, ideas:renderIdeas, daily:renderDaily, wellness:renderWellness, weekly:renderWeekly, weeklyreview:renderWeeklyReview, monthly:renderMonthly, monthlyreview:renderMonthlyReview, quarterlyreview:renderQuarterlyReview, midyear:renderMidyear, vision:renderVision, challenges:renderChallenges, wins:renderWins, badges:renderBadges, focus:renderFocus, sprints:renderSprints, savings:renderSavings, reading:renderReading, bucket:renderBucket, pixels:renderPixels, gratitude:renderGratitude, notes:renderNotes, letter:renderLetter, calendar:renderCalendar, settings:renderSettings};
function render(){ const sec=S.lastSection||"home"; document.body.classList.toggle("on-home", sec==="home"); (RENDER[sec]||renderHome)(); buildSidebar(); }
function showOnboarding(){ openModal(`<h3>Welcome to your 2027 ✦</h3><p class="mut">Thirty seconds of setup, then the year is yours. Everything stays on this device — nothing is uploaded, ever.</p>
 <label>Your name (optional)</label><input id="ob_name" placeholder="e.g. Alex">
 <label>Your word for 2027 (optional)</label><input id="ob_word" placeholder="e.g. Consistency">
 <label>Currency</label><select id="ob_cur"><option>$</option><option>£</option><option>€</option><option>₹</option><option>₨</option></select>
 <label>Theme</label><select id="ob_theme">${THEMES.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select>
 <label>Profile photo (optional)</label><input type="file" id="ob_photo" accept="image/*">
 <div class="row" style="margin-top:18px"><button class="btn gold" id="ob_done">Start my 2027 →</button><button class="btn ghost" id="ob_skip">Skip for now</button></div>
 <p class="small mut" style="margin-top:10px">🔒 Privacy note: this planner works fully offline. Your entries are stored only in this browser on this device.</p>`);
 const finish=(photo)=>{ S.profile.name=$("#ob_name").value.trim(); S.profile.word=$("#ob_word").value.trim(); S.profile.currency=$("#ob_cur").value; S.settings.theme=$("#ob_theme").value; if(photo) S.profile.photo=photo; S.profile.onboarded=true; save(); applyTheme(); closeModal(); confetti(); toast("✦ Welcome to 2027 — let's make it count!"); go("home"); };
 $("#ob_done").onclick=()=>{ const f=$("#ob_photo").files[0]; if(f) readImage(f,300,url=>finish(url)); else finish(null); };
 $("#ob_skip").onclick=()=>{ S.profile.onboarded=true; save(); closeModal(); go("home"); }; }
document.getElementById("searchBtn").addEventListener("click", ()=>{ go("home"); setTimeout(()=>{ const s=$("#homeSearch"); if(s) s.focus(); },60); });
if(DEMO) document.body.classList.add("demo");
load(); applyTheme();
if(!S.profile.onboarded && !DEMO){ render(); showOnboarding(); } else { render(); }
</script>
