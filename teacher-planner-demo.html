<!DOCTYPE html>
<html lang="en" data-theme="chalkmint">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO — Teacher Planner App — Today Board, Gradebook & One-Tap Sub Folder — The Digital Planner Era</title>
<style>
:root{
  --bg:#FAF5EA; --card:#FFFFFF; --ink:#26343F; --muted:#71808C; --line:#E7DCC4;
  --accent:#2E7D5B; --accent2:#40586E; --accent-soft:#E2F2E8; --good:#1E9E6A; --bad:#D64545; --warn:#E8871E;
  --grad:linear-gradient(120deg,#2E7D5B,#57B98A); --shadow:0 8px 24px rgba(46,90,70,.12); --radius:16px;
}
html[data-theme="chalkboard"]{--bg:#22302A;--card:#2E4238;--ink:#F2F7F1;--muted:#A9C4B2;--line:#3D5A4B;--accent:#7FE0B2;--accent2:#FFD166;--accent-soft:#35503F;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="midnightmarking"]{--bg:#10182B;--card:#1B2742;--ink:#EAF0FF;--muted:#9DB1DC;--line:#2A3A63;--accent:#7CA6FF;--accent2:#FFB86B;--accent-soft:#22335C;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="plumnotes"]{--bg:#2B1030;--card:#3D1745;--ink:#FBEFFD;--muted:#D3A6DC;--line:#52255E;--accent:#E58BE8;--accent2:#7FE0B2;--accent-soft:#481E52;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="foreststaff"]{--bg:#0F241A;--card:#1A3A2A;--ink:#EBF7EF;--muted:#9DC4AC;--line:#2A5240;--accent:#5ED598;--accent2:#E9C46A;--accent-soft:#21452F;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="charcoalgold"]{--bg:#1C1C1E;--card:#2A2A2E;--ink:#F4F4F0;--muted:#B5B5AC;--line:#3D3D42;--accent:#E9C46A;--accent2:#7FE0B2;--accent-soft:#33332A;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-theme="staffroom"]{--bg:#FBF3E4;--card:#FFFFFF;--ink:#43301C;--muted:#A3805C;--line:#EFDFC2;--accent:#B5651D;--accent2:#2E7D5B;--accent-soft:#FBEED3}
html[data-theme="skytimetable"]{--bg:#EDF5FF;--card:#FFFFFF;--ink:#173A5E;--muted:#64819F;--line:#D2E4F7;--accent:#2272C9;--accent2:#E8873A;--accent-soft:#DCEBFC}
html[data-theme="peachplanner"]{--bg:#FFF4EA;--card:#FFFFFF;--ink:#4A2C14;--muted:#A97E56;--line:#F5DEC4;--accent:#E85D04;--accent2:#2E7D5B;--accent-soft:#FFE8D1}
html[data-theme="lavenderdesk"]{--bg:#F4F0FD;--card:#FFFFFF;--ink:#33255C;--muted:#8B7BB8;--line:#E0D6F5;--accent:#7C4DFF;--accent2:#0E9F6E;--accent-soft:#EAE2FD}
html[data-colourful="off"]{--accent2:var(--accent)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{resize:vertical;min-height:56px}
label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin:12px 0 5px}
#bgphoto{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.16;pointer-events:none;z-index:0}
#appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:2px solid var(--line)}
#appbar .logo{font-size:21px}
#appbar .ttl{font-weight:800;font-size:16.5px;line-height:1.1}
#appbar .ttl small{display:block;font-size:11px;color:var(--muted);font-weight:600}
#appbar .sp{flex:1}
.ava{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden;cursor:pointer;border:2.5px solid var(--accent2);flex:none;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.ava:hover::after{content:'📷';position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:15px}
.iconbtn{background:var(--accent-soft);border:none;border-radius:11px;padding:9px 12px;font-size:16px;color:var(--ink)}
.iconbtn:hover{background:var(--accent);color:#fff}
#shell{display:flex;max-width:1280px;margin:0 auto;position:relative;z-index:1}
#sidebar{width:238px;flex:none;padding:16px 10px;display:none}
#sidebar.open{display:block}
@media(min-width:900px){#sidebar{display:block;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}}
@media(max-width:899px){#sidebar{position:fixed;left:0;top:62px;bottom:0;background:var(--card);z-index:35;box-shadow:var(--shadow)}}
#sidebar a{display:flex;gap:9px;align-items:center;padding:8.5px 11px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px}
#sidebar a:hover{background:var(--accent-soft)}
#sidebar a.on{background:var(--grad);color:#fff}
#sidebar .grp{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:13px 11px 5px;text-transform:uppercase}
main{flex:1;padding:18px 16px 70px;min-width:0}
.hero{background:var(--grad);border-radius:20px;color:#fff;padding:24px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'🎓';position:absolute;right:14px;top:8px;font-size:64px;opacity:.22}
.hero h1{font-size:27px;line-height:1.15}
.hero .sub{opacity:.92;margin-top:5px;font-size:14.5px}
.daycount{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:rgba(255,255,255,.3)}
.ring .pr{stroke:#FFD166;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{fill:#fff;font-weight:800;font-size:19px}
.pacebadge{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);padding:9px 14px;border-radius:12px;font-weight:800;font-size:15px}
.quickrow{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.qbtn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 15px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:var(--shadow)}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px;margin-top:8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .ic{font-size:27px}
.card h3{font-size:16px;margin:8px 0 4px}
.card p{font-size:13px;color:var(--muted);line-height:1.45}
.card .bar{height:7px;background:var(--accent-soft);border-radius:5px;margin-top:11px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.card .pct{font-size:11.5px;font-weight:800;color:var(--accent);margin-top:5px}
.secttl{display:flex;align-items:center;gap:11px;margin-bottom:6px;flex-wrap:wrap}
.secttl h2{font-size:23px}
.secttl .sp{flex:1}
.infobtn{margin-left:auto;background:var(--accent2);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;box-shadow:var(--shadow)}
.backbtn{background:none;border:none;font-size:15px;font-weight:700;color:var(--accent);padding:6px 0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.panel h3{font-size:16.5px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.btn{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-weight:800;font-size:14.5px}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:#D64545}
.btn:disabled{opacity:.5}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3.5px 11px;font-size:12px;font-weight:800;margin:2px 3px 2px 0}
.chip.amber{background:#FDEBC8;color:#8A5A00}
html[data-theme="chalkboard"] .chip.amber,html[data-theme="midnightmarking"] .chip.amber,html[data-theme="plumnotes"] .chip.amber,html[data-theme="foreststaff"] .chip.amber,html[data-theme="charcoalgold"] .chip.amber{background:#4A3603;color:#FFD166}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:9px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15px}
.item .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.mini{background:none;border:none;font-size:16px;padding:4px}
.tick{width:27px;height:27px;flex:none;border-radius:9px;border:2px solid var(--accent);background:var(--card);font-size:15px;color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tick.on{background:var(--accent);color:#fff}
.done-t{text-decoration:line-through;opacity:.55}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);margin-top:14px;font-size:14.5px;line-height:1.55}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal h3{font-size:19px;margin-bottom:8px}
.modal .x{float:right;background:none;border:none;font-size:20px;color:var(--muted)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:99;transition:transform .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.paceline{height:16px;background:var(--accent-soft);border-radius:9px;position:relative;margin:10px 0 4px}
.paceline .ideal{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted);border-radius:2px}
.paceline .actual{height:100%;background:var(--grad);border-radius:9px}
table.cal{width:100%;border-collapse:collapse;margin-top:8px}
table.cal th{font-size:11.5px;color:var(--muted);padding:5px 2px;text-transform:uppercase}
table.cal td{border:1px solid var(--line);height:52px;vertical-align:top;padding:4px;font-size:12px;width:14.28%}
table.cal td .dn{font-weight:800;font-size:13px}
table.cal td.sprint{background:var(--accent-soft)}
table.cal td.today{outline:2.5px solid var(--accent2);outline-offset:-2px}
table.cal td{cursor:pointer}
.hgrid{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.hgrid .cell{width:19px;height:19px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--line);cursor:pointer;font-size:0}
.hgrid .cell.on{background:var(--accent)}
.hgrid .cell.today{outline:2px solid var(--accent2)}
.hgrid .cell.future{opacity:.35;cursor:default}
.scorebig{font-size:44px;font-weight:900;line-height:1}
.cert{background:linear-gradient(135deg,#FFFDF5,#FBF3DC);color:#2A2140;border:3px solid #C9A227;border-radius:14px;padding:34px 26px;text-align:center;position:relative}
.cert::before{content:'';position:absolute;inset:9px;border:1.5px solid #C9A227;border-radius:9px;pointer-events:none}
.cert h2{font-family:Georgia,serif;font-size:31px;color:#6C2BD9}
.cert .nm{font-family:Georgia,serif;font-size:27px;font-weight:700;margin:10px 0}
.paper{background:var(--card);border:1.5px solid var(--line);border-radius:12px;min-height:300px;padding:14px;margin-top:10px}
.paper.lined{background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 28px)}
.paper.dotted{background-image:radial-gradient(var(--line) 1.3px,transparent 1.4px);background-size:22px 22px}
.paper.gridp{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.paper textarea{background:transparent;border:none;width:100%;min-height:280px;line-height:28px;font-size:15px}
.paper textarea:focus{outline:none}
.honest{text-align:center;color:var(--muted);font-size:12.5px;margin-top:34px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-top:14px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.kpi b{font-size:23px;display:block}
.kpi span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
svg text{font-family:inherit}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:3px;width:104px;padding:13px 6px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-size:12px;font-weight:700}
.badge .bi{font-size:29px}
.badge.off{opacity:.38;filter:grayscale(1)}
#timerov{position:fixed;inset:0;background:#1D1233;color:#fff;display:none;z-index:90;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#timerov.open{display:flex}
#timerov .clock{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums}
@media print{ #appbar,#sidebar,.quickrow,.infobtn,.backbtn,#toast,.noprint{display:none!important} body{background:#fff} main{padding:0} .panel,.card{box-shadow:none} }
</style>
</head>
<body>
<div id="bgphoto"></div>
<header id="appbar">
  <button class="iconbtn" id="menubtn" title="Menu">☰</button>
  <div class="logo">🍎</div>
  <div class="ttl">Teacher Desk<small>THE DIGITAL PLANNER ERA</small></div>
  <div class="sp"></div>
  <button class="iconbtn" id="themebtn" title="Themes & colours">🎨</button>
  <button class="iconbtn" id="printbtn" title="Print this section">🖨️</button>
  <div class="ava" id="avatar" title="Your profile photo — tap to change">S</div>
  <input type="file" id="avatarFile" accept="image/*" style="display:none">
</header>
<div id="shell">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="modal" id="infomodal"><div class="box" id="infobox"></div></div>
<div id="timerov">
  <div style="font-size:19px;font-weight:700" id="ovlabel">Focus Sprint</div>
  <div class="clock" id="ovclock">25:00</div>
  <div style="opacity:.85" id="ovgoal"></div>
  <div class="row" style="max-width:340px;width:90%">
    <button class="btn" id="ovpause" style="flex:1">⏸ Pause</button>
    <button class="btn ghost" id="ovend" style="flex:1;background:transparent;color:#fff;border-color:#fff">⏹ End & log</button>
  </div>
</div>
<div id="toast"></div>
<div class="modal" id="onboard"><div class="box" id="onboardbox"></div></div>
<script>
/* ============ TEACHER DESK — CORE ============ */
const LS_KEY='teacherDesk_v1';
const DEMO = document.title.includes('DEMO');
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=> 'id'+Math.random().toString(36).slice(2,9);
const esc=s=> String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=iso=>{ if(!iso) return '—'; const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const addDays=(iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysUntil=iso=> Math.round((new Date(iso+'T12:00:00')-new Date(todayISO()+'T12:00:00'))/86400000);
const dowName=iso=> new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});
const nextSchoolDay=(iso)=>{ let d=addDays(iso||todayISO(),1); while([0,6].includes(new Date(d+'T12:00:00').getDay())) d=addDays(d,1); return d; };
const THEMES=[
 ['chalkmint','🍎 Chalk & Mint','light'],['chalkboard','🖤 Chalkboard Slate','dark'],
 ['staffroom','☕ Staffroom Cream','light'],['midnightmarking','🌙 Midnight Marking','dark'],
 ['skytimetable','☁️ Sky Timetable','light'],['plumnotes','📚 Plum Notes','dark'],
 ['peachplanner','🍑 Peach Planner','light'],['foreststaff','🌲 Forest Staffroom','dark'],
 ['lavenderdesk','💜 Lavender Desk','light'],['charcoalgold','✏️ Charcoal & Gold','dark']];
const CATS=['Test','Quiz','Homework','Project'];
const CLASSCOLORS=['#2E7D5B','#2272C9','#E85D04','#7C4DFF','#C2185B','#00838F','#6D4C41','#5E35B1'];
function blankState(){ return {
 profile:{name:'',school:'',yearTerm:'',theme:'chalkmint',accent:'',colourful:true,photo:'',onboarded:false},
 classes:[], students:[], bell:[{n:1,label:'Period 1',start:'08:00',end:'08:50'},{n:2,label:'Period 2',start:'09:00',end:'09:50'},{n:3,label:'Period 3',start:'10:10',end:'11:00'},{n:4,label:'Period 4',start:'11:10',end:'12:00'},{n:5,label:'Period 5',start:'13:00',end:'13:50'},{n:6,label:'Period 6',start:'14:00',end:'14:50'}],
 units:[], lessons:[], assignments:[], grades:{}, attendance:{}, seating:{},
 incidents:[], contacts:[], meetings:[], skills:[], duties:[],
 weights:{Test:40,Quiz:20,Homework:20,Project:20}, subNotes:'',
 notes:{paper:'lined',text:''}, lastBackup:'', lastSection:'home', createdAt:Date.now() }; }
let S;
function save(){ if(DEMO) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=Object.assign(blankState(), JSON.parse(raw)); return; } }catch(e){} S=blankState(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function openModal(html){ $('#modalbox').innerHTML='<button class="x" onclick="closeModal()">✕</button>'+html; $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }
function confirmBox(msg, fn){ openModal('<h3>Are you sure?</h3><p style="line-height:1.55;color:var(--muted)">'+esc(msg)+'</p><div class="row" style="margin-top:16px"><button class="btn danger" id="cfYes">Yes, do it</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>'); $('#cfYes').onclick=()=>{ closeModal(); fn(); }; }
/* ============ SECTIONS ============ */
const SECTIONS=[
 ['home','🏠','Today Board','Live bell schedule, today\u2019s lessons, your Tomorrow-Ready Score'],
 ['classes','🎒','My Classes & Rosters','Up to 6 classes — names, subjects, rooms and rosters'],
 ['students','🧑‍🎓','Student Profiles','One live profile per student, built from your roster'],
 ['calendar','📅','School Year Calendar','Lessons, duties and events across the year'],
 ['units','🗺️','Unit Planner','Plan units week by week — they draft your lessons'],
 ['weekly','🗓️','Weekly Lesson Plans','The week at a glance, class by class'],
 ['daily','📖','Daily Lesson Plans','Objectives, materials and done-ticks, day by day'],
 ['gradebook','📊','Gradebook','Auto-calculating, weighted by category'],
 ['analytics','📈','Grade Analytics','Distribution, trends and class averages'],
 ['attendance','✅','Attendance','One tap per student — present, absent, late'],
 ['seating','🪑','Seating Planner','Auto-arrange desks — even data-aware'],
 ['behaviour','📝','Behaviour & Incidents','Positives, concerns and incidents, logged'],
 ['atrisk','🚨','At-Risk Radar','Cross-module flags before they become problems'],
 ['parents','📞','Parent Contact Log','Every call, email and meeting with home'],
 ['reports','🖨️','Report Season','Comments drafted from real grades — autopilot'],
 ['meetings','🤝','Meetings & Notes','Staff, parents, leadership — notes and actions'],
 ['subfolder','🆘','Sub Folder','One tap — built from today\u2019s real plans'],
 ['retakes','🔁','Retakes & Missing Work','Missing work tracked until it lands'],
 ['skills','🎯','Student Data Tracker','Skill-by-skill levels for every student'],
 ['duties','🎽','Duties & School Events','Playground duty, clubs, assemblies, trips'],
 ['birthdays','🎂','Birthdays & Celebrations','Never miss a birthday in your classes'],
 ['notes','🗒️','Notes','Lined, dotted or grid — quick jottings'],
 ['print','🖨️','Print Centre','Sub folder, reports, rosters — print-ready'],
 ['backup','💾','Backup & Data','JSON backup, CSV exports, new-year rollover'],

function go(id){ if(id!==currentSection) navStack.push(currentSection); currentSection=id; S.lastSection=id; save(); render(); const sb=$('#sidebar'); if(sb) sb.classList.remove('open'); window.scrollTo(0,0); }

function buildSidebar(){ const nav=$('#sidebar'); if(!nav) return; nav.innerHTML='<div style="padding:6px 10px 12px;font-weight:800">🍎 Teacher Desk</div>'+SECTIONS.map(s=>'<button class="navbtn '+(currentSection===s[0]?'on':'')+'" onclick="go(\''+s[0]+'\')"><span>'+s[1]+'</span>'+esc(s[2])+'</button>').join('')+'<div style="padding:12px 10px;font-size:12px;color:var(--muted);line-height:1.5">🔒 Student data never leaves this device.<br>No account. No cloud. No sync.</div>'; const av=$('#avatar'); if(av){ if(S.profile.photo){ av.style.backgroundImage='url('+S.profile.photo+')'; av.textContent=''; } else { av.style.backgroundImage=''; av.textContent=(S.profile.name||'T').trim().charAt(0).toUpperCase()||'T'; } } }

function applyTheme(){ const p=S.profile; document.documentElement.dataset.theme=p.theme||'chalkmint'; document.documentElement.dataset.colourful=p.colourful===false?'off':'on'; if(p.accent) document.documentElement.style.setProperty('--accent',p.accent); else document.documentElement.style.removeProperty('--accent'); const bg=$('#bgphoto'); if(bg){ if(p.bgphoto){ bg.style.backgroundImage='url('+p.bgphoto+')'; bg.classList.add('on'); } else { bg.style.backgroundImage=''; bg.classList.remove('on'); } } buildSidebar(); }
function setTheme(id){ S.profile.theme=id; save(); applyTheme(); render(); }
/* ============ ENGINES ============ */
const studentsOf=cid=> S.students.filter(s=>s.classId===cid);
const className=cid=> (S.classes.find(c=>c.id===cid)||{}).name||'—';
const studentName=sid=> (S.students.find(s=>s.id===sid)||{}).name||'—';
function scorePct(aid, sid){ const g=(S.grades[aid]||{})[sid]; if(g===undefined||g===null||g==='') return null; const a=S.assignments.find(x=>x.id===aid); return a? (g/a.max)*100 : null; }
function studentAvg(sid){ const st=S.students.find(s=>s.id===sid); if(!st) return null; let num=0, den=0; CATS.forEach(cat=>{ const as=S.assignments.filter(a=>a.cat===cat && a.classId===st.classId); const ps=as.map(a=>scorePct(a.id,sid)).filter(p=>p!==null); if(ps.length){ num+= (ps.reduce((x,y)=>x+y,0)/ps.length) * (S.weights[cat]||0); den+= (S.weights[cat]||0); } }); return den? Math.round(num/den) : null; }
function attRecord(sid){ let rec=0, att=0; Object.values(S.attendance).forEach(day=>{ const m=day[sid]; if(m){ rec++; if(m==='P'||m==='L') att++; } }); return {rec, att, rate: rec? Math.round(att/rec*100) : null}; }
function missingFor(sid){ const st=S.students.find(s=>s.id===sid); if(!st) return []; return S.assignments.filter(a=>a.classId===st.classId && a.due<todayISO() && scorePct(a.id,sid)===null); }
function riskFlags(sid){ const f=[]; const st=S.students.find(s=>s.id===sid); if(!st) return f; const miss=missingFor(sid); if(miss.length>=2) f.push({icon:'📚', text:miss.length+' missing assignments piling up', sev:3}); else if(miss.length===1) f.push({icon:'📚', text:'1 missing assignment', sev:1});
 const ar=attRecord(sid); if(ar.rec>=5 && ar.rate<90) f.push({icon:'🕐', text:'Attendance sliding — '+ar.rate+'% of '+ar.rec+' days', sev:3});
 const avg=studentAvg(sid); if(avg!==null && avg<65) f.push({icon:'📉', text:'Weighted average at '+avg+'%', sev:2});
 const recent=S.incidents.filter(i=>i.studentId===sid && i.type!=='Positive' && daysUntil(i.date)>=-14 && daysUntil(i.date)<=0 && !i.contacted); if(recent.length) f.push({icon:'📞', text:recent.length+' recent incident(s) not yet followed up with home', sev:2});
 return f; }
function allFlags(){ return S.students.map(st=>({st, flags:riskFlags(st.id)})).filter(x=>x.flags.length).sort((a,b)=> b.flags.reduce((n,f)=>n+f.sev,0)-a.flags.reduce((n,f)=>n+f.sev,0)); }
function gradingBacklog(){ return S.assignments.filter(a=>a.due<todayISO()).map(a=>({a, ungraded:studentsOf(a.classId).filter(st=>scorePct(a.id,st.id)===null).length, total:studentsOf(a.classId).length})).filter(x=>x.ungraded>0); }
function tomorrowReady(){ const tm=nextSchoolDay(todayISO()); const tl=S.lessons.filter(l=>l.date===tm); const planned= tl.length? 30:0; const mats= tl.length? Math.round(25 * (tl.filter(l=>l.materialsDone).length/tl.length)) : 0;
 const dueA=S.assignments.filter(a=>a.due<=todayISO()); let gr=25; if(dueA.length){ let tot=0, got=0; dueA.forEach(a=>{ studentsOf(a.classId).forEach(st=>{ tot++; if(scorePct(a.id,st.id)!==null) got++; }); }); gr= tot? Math.round(25*got/tot):25; }
 const attDone= S.classes.some(c=> S.attendance[todayISO()+'|'+c.id] && Object.keys(S.attendance[todayISO()+'|'+c.id]).length>0 ) ? 20:0;
 return {score:planned+mats+gr+attDone, planned, mats, gr, attDone, tm, lessons:tl}; }
function gradeDist(){ const b={'A (90+)':0,'B (80–89)':0,'C (70–79)':0,'D (60–69)':0,'F (under 60)':0}; S.students.forEach(st=>{ const a=studentAvg(st.id); if(a===null) return; if(a>=90)b['A (90+)']++; else if(a>=80)b['B (80–89)']++; else if(a>=70)b['C (70–79)']++; else if(a>=60)b['D (60–69)']++; else b['F (under 60)']++; }); return b; }
function bandWord(avg){ if(avg===null) return 'is settling into the class routines'; if(avg>=90) return 'is producing excellent work'; if(avg>=80) return 'is working very well'; if(avg>=70) return 'is making good, steady progress'; if(avg>=60) return 'is making progress, with some areas to strengthen'; return 'is finding some areas difficult at the moment and is being supported'; }
function reportComment(st){ const avg=studentAvg(st.id); const ar=attRecord(st.id); const pos=S.incidents.filter(i=>i.studentId===st.id&&i.type==='Positive').length; const con=S.incidents.filter(i=>i.studentId===st.id&&i.type!=='Positive').length; const sk=S.skills.filter(k=>k.classId===st.classId).map(k=>({skill:k.skill, lvl:(k.levels||{})[st.id]||0})).sort((a,b)=>b.lvl-a.lvl)[0];
 let c=st.name.split(' ')[0]+' '+bandWord(avg)+(avg!==null? ' this term, with a weighted average of '+avg+'%':'')+'. ';
 if(ar.rate!==null) c+='Attendance stands at '+ar.rate+'%'+(ar.rate>=95?' — exemplary.':ar.rate>=90?' — good.':' and improving attendance would support further progress.');
 if(sk&&sk.lvl>=2) c+=' A particular strength is '+sk.skill.toLowerCase()+' ('+(sk.lvl===3?'exceeding expectations':'secure')+').';
 if(pos>con&&pos>0) c+=' In class, '+st.name.split(' ')[0]+' contributes positively and is a pleasure to teach.';
 else if(con>0) c+=' We are working together on consistent routines and focus in lessons.';
 const miss=missingFor(st.id); if(miss.length) c+=' Completing the '+miss.length+' outstanding assignment(s) promptly will lift results further.';
 c+=' Keep up the effort next term.'; return c; }

 case 'attendance': { const days=Object.keys(S.attendance).length; return Math.min(1,days/20); }

 const todays=S.lessons.filter(l=>l.date===t).sort((a,b)=>(a.period||9)-(b.period||9));

function showOnboarding(){ $('#onboardbox').innerHTML='<h2>🍎 Welcome to your Teacher Desk</h2><p style="line-height:1.6;color:var(--muted)">Your whole teaching day in one private file: Today Board, gradebook, seating, reports — and a sub folder that writes itself. Sixty seconds to set up.</p>'
 +'<label>Your name (optional)</label><input id="ob_name" placeholder="e.g. Sarah Rivera">'

 +'<label>Profile photo (optional)</label><input id="ob_photo" type="file" accept="image/*">'
 +'<div style="background:var(--accent-soft);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.6;margin-top:14px">🔒 <b>The privacy promise:</b> your students\u2019 data lives ONLY in this file, on your device. No account, no cloud, no sync, nothing uploaded — ever. Export a backup from Backup &amp; Data to keep it safe.</div>'
 +'<div class="row" style="margin-top:18px"><button class="btn" onclick="finishOnboarding(false)">Start teaching →</button><button class="btn ghost" onclick="finishOnboarding(true)">Skip setup</button></div>';
 $('#onboard').classList.add('open'); }
function finishOnboarding(skip){ if(!skip){ S.profile.name=$('#ob_name').value.trim(); S.profile.school=$('#ob_school').value.trim(); S.profile.yearTerm=$('#ob_term').value.trim(); S.profile.theme=$('#ob_theme').value; const f=$('#ob_photo').files[0]; if(f){ const r=new FileReader(); r.onload=()=>{ S.profile.photo=r.result; save(); applyTheme(); }; r.readAsDataURL(f); } }
 S.profile.onboarded=true; save(); applyTheme(); $('#onboard').classList.remove('open'); toast('🍎 Desk ready — add your first class'); render(); }

function renderGuide(){ let h=secHead('guide','📘','Guide & Worked Example');
 h+='<div class="panel"><h3>🍎 The idea</h3><p style="line-height:1.65;font-size:14.5px">One offline file that runs your teaching day: plan units, draft lessons, mark attendance in a minute, keep a weighted gradebook, spot at-risk students early, draft report comments from real data, and generate a substitute folder in one tap. No account, no Canva, no subscription — and <b>your students\u2019 data never leaves your device</b>.</p></div>';
 h+='<div class="panel"><h3>✨ The 5 things nobody else does</h3><ol style="line-height:1.8;font-size:14.5px;margin-left:18px"><li><b>One-Tap Sub Folder</b> — built from today\u2019s real lessons, rosters and seating, not blank pages.</li><li><b>Report Season Autopilot</b> — comments drafted from each student\u2019s actual grades, attendance and behaviour.</li><li><b>At-Risk Radar</b> — cross-module flags (missing work × attendance × averages × follow-ups).</li><li><b>Unit-to-Week Drafting</b> — unit plans cascade into daily lessons; unfinished lessons roll forward with content.</li><li><b>Tomorrow-Ready Score</b> — one live % that tomorrow is genuinely ready.</li></ol></div>';
 h+='<div class="panel"><h3>🎬 The worked example (demo)</h3><p style="line-height:1.65;font-size:14.5px">The demo is pre-loaded with Ms Rivera\u2019s Grade 5: two classes (5A Maths, 5B Science), 18 students, a Fractions unit with drafted lessons, a weighted gradebook, 8 days of attendance — and one student, Liam, quietly flagging on the Radar (2 missing assignments, sliding attendance, an un-followed-up incident). Open the Radar to see the system think. In the full version you can reload this example any time from Backup &amp; Data.</p></div>';
 h+='<div class="panel"><h3>🔒 The privacy promise — in plain words</h3><p style="line-height:1.65;font-size:14.5px">This file stores everything in your own browser, on your own device. There is no server, no account and no sync — The Digital Planner Era never sees your students\u2019 names, grades or notes. The honest trade-off: if you lose the device or clear the browser, the data goes too — so export a JSON backup monthly (Backup &amp; Data nudges you after 30 days), and use CSV exports when school needs numbers.</p></div>';
 h+='<div class="panel"><h3>🚀 A good first week</h3><ol style="line-height:1.8;font-size:14.5px;margin-left:18px"><li>Add your classes and paste your rosters (My Classes).</li><li>Set your bell schedule and grade weights (Settings).</li><li>Plan one unit and press "Draft week" (Unit Planner).</li><li>Mark attendance daily — it takes a minute and feeds everything.</li><li>Glance at the Radar every Friday. That\u2019s the habit that changes outcomes.</li></ol></div>';

function saveProfileSettings(){ S.profile.name=$('#pf_name').value; S.profile.school=$('#pf_school').value; S.profile.yearTerm=$('#pf_term').value; save(); applyTheme(); toast('💾 Profile saved'); render(); }

function saveWeights(){ CATS.forEach(c=> S.weights[c]=Math.max(0,+$('#w_'+c).value||0)); save(); toast('📊 Weights saved — averages updated'); }
function bellEdit(i,k,v){ S.bell[i][k]=v; save(); }
